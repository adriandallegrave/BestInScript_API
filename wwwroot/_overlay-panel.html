<!-- BIS_OVERLAY_PANEL_MARKER -->
<style>
    /* Overlay-settings modal — themed off index.html CSS variables. */
    #bis-ov-trigger {
        background: var(--bg3);
        color: var(--text);
        padding: 6px 12px;
        border: 1px solid var(--border);
        margin-right: 8px;
    }

        #bis-ov-trigger:hover {
            color: var(--accent);
        }

    #bis-ov-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, .55);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }

        #bis-ov-backdrop.open {
            display: flex;
        }

    #bis-ov-dialog {
        width: 440px;
        max-width: calc(100vw - 32px);
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text);
        font-family: var(--font);
        box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
        overflow: hidden;
    }

        #bis-ov-dialog header {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            background: var(--bg1);
        }

            #bis-ov-dialog header h2 {
                font-size: 13px;
                font-weight: 700;
                letter-spacing: .08em;
                text-transform: uppercase;
                color: var(--accent);
                flex: 1;
                margin: 0;
            }

    #bis-ov-close {
        background: transparent;
        color: var(--muted);
        font-size: 18px;
        line-height: 1;
        padding: 2px 8px;
        border: none;
    }

        #bis-ov-close:hover {
            color: var(--text);
        }

    #bis-ov-body {
        padding: 16px 18px 8px;
    }

        #bis-ov-body .row {
            display: grid;
            grid-template-columns: 110px 1fr;
            gap: 10px 14px;
            align-items: center;
            margin-bottom: 10px;
        }

        #bis-ov-body label {
            margin: 0;
            color: var(--muted);
            font-size: 11px;
        }

        #bis-ov-body select,
        #bis-ov-body input[type=number] {
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius);
            padding: 6px 8px;
            font-size: 13px;
            width: 100%;
            font-family: var(--font);
        }

            #bis-ov-body select:focus,
            #bis-ov-body input:focus {
                outline: none;
                border-color: var(--accent);
            }

    .bis-ov-check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--text);
        font-size: 13px;
    }

        .bis-ov-check input {
            accent-color: var(--accent);
        }

    #bis-ov-anchors {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
    }

        #bis-ov-anchors button {
            aspect-ratio: 2 / 1;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 0;
            cursor: pointer;
            transition: background .12s, border-color .12s;
        }

            #bis-ov-anchors button:hover {
                background: var(--bg1);
            }

            #bis-ov-anchors button.active {
                background: var(--accent);
                border-color: var(--accent2);
            }

    #bis-ov-dialog footer {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 18px;
        border-top: 1px solid var(--border);
        background: var(--bg1);
    }

    #bis-ov-save {
        background: var(--accent);
        color: #1a1a25;
        padding: 7px 16px;
        border: none;
        font-weight: 600;
    }

    #bis-ov-saved {
        color: var(--green);
        font-size: 12px;
        opacity: 0;
        transition: opacity .18s;
    }

        #bis-ov-saved.show {
            opacity: 1;
        }

        #bis-ov-saved.error {
            color: var(--red);
        }

    /* Inline error banner so the user sees API failures instead of nothing. */
    #bis-ov-error {
        display: none;
        margin: 0 18px 12px;
        padding: 8px 10px;
        background: rgba(232, 82, 82, .12);
        border: 1px solid rgba(232, 82, 82, .4);
        border-radius: var(--radius);
        color: var(--red);
        font-size: 12px;
        line-height: 1.5;
    }

        #bis-ov-error.show {
            display: block;
        }

    /* Event-timer section */
    #bis-ov-events {
        margin-top: 6px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
    }

    .bis-ov-section-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 10px;
    }

    .bis-ov-evt {
        background: var(--bg1);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 10px;
        margin-bottom: 8px;
    }

        .bis-ov-evt-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .bis-ov-evt-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        .bis-ov-evt-preview {
            font-size: 11px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .bis-ov-evt-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

            .bis-ov-evt-controls .bis-ov-check {
                margin-bottom: 0;
                font-size: 12px;
            }

        .bis-ov-lead {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            color: var(--text);
            margin: 0;
        }

            .bis-ov-lead input[type=number] {
                width: 52px;
                padding: 4px 6px;
            }

        .bis-ov-evt-controls input[type=color] {
            width: 34px;
            height: 24px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: none;
            cursor: pointer;
        }

        .bis-ov-color-def {
            background: var(--bg3);
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 11px;
            padding: 3px 7px;
            cursor: pointer;
        }

            .bis-ov-color-def:hover {
                color: var(--text);
            }
</style>

<div id="bis-ov-backdrop" role="dialog" aria-modal="true" aria-labelledby="bis-ov-title">
    <div id="bis-ov-dialog">
        <header>
            <h2 id="bis-ov-title">Overlay Settings</h2>
            <button id="bis-ov-close" type="button" aria-label="Close">✕</button>
        </header>

        <div id="bis-ov-error"></div>

        <div id="bis-ov-body">
            <label class="bis-ov-check">
                <input type="checkbox" id="bis-ov-enabled">
                <span>Show on-screen overlay</span>
            </label>
            <label class="bis-ov-check">
                <input type="checkbox" id="bis-ov-hideidle">
                <span>Hide when no script is running</span>
            </label>

            <div class="row">
                <label for="bis-ov-screen">Display</label>
                <select id="bis-ov-screen"></select>
            </div>

            <div class="row">
                <label>Placement</label>
                <div id="bis-ov-anchors">
                    <button type="button" data-a="TopLeft" title="Top left"></button>
                    <button type="button" data-a="TopCenter" title="Top center"></button>
                    <button type="button" data-a="TopRight" title="Top right"></button>
                    <button type="button" data-a="MiddleLeft" title="Middle left"></button>
                    <button type="button" data-a="MiddleCenter" title="Center"></button>
                    <button type="button" data-a="MiddleRight" title="Middle right"></button>
                    <button type="button" data-a="BottomLeft" title="Bottom left"></button>
                    <button type="button" data-a="BottomCenter" title="Bottom center"></button>
                    <button type="button" data-a="BottomRight" title="Bottom right"></button>
                </div>
            </div>

            <div class="row">
                <label for="bis-ov-margin">Margin</label>
                <input type="number" id="bis-ov-margin" min="0" max="400" step="2">
            </div>
            <div class="row">
                <label for="bis-ov-opacity">Opacity</label>
                <input type="number" id="bis-ov-opacity" min="0.1" max="1" step="0.05">
            </div>
            <div class="row">
                <label for="bis-ov-fontsize">Font size</label>
                <input type="number" id="bis-ov-fontsize" min="8" max="32" step="1">
            </div>

            <div id="bis-ov-events">
                <p class="bis-ov-section-title">Diablo 4 event timers</p>
                <label class="bis-ov-check">
                    <input type="checkbox" id="bis-ov-events-enabled">
                    <span>Show world boss / helltide / legion timers</span>
                </label>

                <div class="bis-ov-evt" data-evt="worldBoss">
                    <div class="bis-ov-evt-head">
                        <span class="bis-ov-evt-name">World Boss</span>
                        <span class="bis-ov-evt-preview" data-preview="worldBoss"></span>
                    </div>
                    <div class="bis-ov-evt-controls">
                        <label class="bis-ov-check"><input type="checkbox" data-k="show"><span>Show</span></label>
                        <label class="bis-ov-check"><input type="checkbox" data-k="alarm"><span>Alarm</span></label>
                        <label class="bis-ov-lead">Lead <input type="number" data-k="lead" min="0" max="120" step="1"> min</label>
                        <input type="color" data-k="color" title="Row color">
                        <button type="button" class="bis-ov-color-def" data-k="colordef">Default</button>
                    </div>
                </div>

                <div class="bis-ov-evt" data-evt="helltide">
                    <div class="bis-ov-evt-head">
                        <span class="bis-ov-evt-name">Helltide</span>
                        <span class="bis-ov-evt-preview" data-preview="helltide"></span>
                    </div>
                    <div class="bis-ov-evt-controls">
                        <label class="bis-ov-check"><input type="checkbox" data-k="show"><span>Show</span></label>
                        <label class="bis-ov-check"><input type="checkbox" data-k="alarm"><span>Alarm</span></label>
                        <label class="bis-ov-lead">Lead <input type="number" data-k="lead" min="0" max="120" step="1"> min</label>
                        <input type="color" data-k="color" title="Row color">
                        <button type="button" class="bis-ov-color-def" data-k="colordef">Default</button>
                    </div>
                </div>

                <div class="bis-ov-evt" data-evt="legion">
                    <div class="bis-ov-evt-head">
                        <span class="bis-ov-evt-name">Legion</span>
                        <span class="bis-ov-evt-preview" data-preview="legion"></span>
                    </div>
                    <div class="bis-ov-evt-controls">
                        <label class="bis-ov-check"><input type="checkbox" data-k="show"><span>Show</span></label>
                        <label class="bis-ov-check"><input type="checkbox" data-k="alarm"><span>Alarm</span></label>
                        <label class="bis-ov-lead">Lead <input type="number" data-k="lead" min="0" max="120" step="1"> min</label>
                        <input type="color" data-k="color" title="Row color">
                        <button type="button" class="bis-ov-color-def" data-k="colordef">Default</button>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <button id="bis-ov-save" type="button">Save</button>
            <span id="bis-ov-saved">Saved</span>
        </footer>
    </div>
</div>

<script>
    (function () {
        const $ = id => document.getElementById(id);

        const EVENTS = ['worldBoss', 'helltide', 'legion'];

        // Color <-> [R,G,B], sharing the "white == no override (null)" convention
        // used by the per-script accent colors elsewhere in the UI.
        function hexToRgb(hex) {
            const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
            return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : null;
        }
        function rgbToHex(rgb) {
            if (!Array.isArray(rgb) || rgb.length !== 3) return null;
            return '#' + rgb.map(v => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, '0')).join('');
        }
        const evtEl = (evt, k) => document.querySelector('.bis-ov-evt[data-evt="' + evt + '"] [data-k="' + k + '"]');
        const previewEl = evt => document.querySelector('.bis-ov-evt-preview[data-preview="' + evt + '"]');

        // 1. Inject the trigger button into the existing header, just before "Stop All".
        const stopBtn = $('btn-stop-all');
        if (stopBtn && !$('bis-ov-trigger')) {
            const btn = document.createElement('button');
            btn.id = 'bis-ov-trigger';
            btn.type = 'button';
            btn.textContent = '⚙ Overlay';
            stopBtn.parentNode.insertBefore(btn, stopBtn);
        }

        const els = {
            trigger: $('bis-ov-trigger'),
            backdrop: $('bis-ov-backdrop'),
            dialog: $('bis-ov-dialog'),
            close: $('bis-ov-close'),
            error: $('bis-ov-error'),
            enabled: $('bis-ov-enabled'),
            hideIdle: $('bis-ov-hideidle'),
            screen: $('bis-ov-screen'),
            anchors: $('bis-ov-anchors'),
            margin: $('bis-ov-margin'),
            opacity: $('bis-ov-opacity'),
            fontSize: $('bis-ov-fontsize'),
            eventsEnabled: $('bis-ov-events-enabled'),
            save: $('bis-ov-save'),
            saved: $('bis-ov-saved')
        };
        let current = null;

        // Reset an event's row color to "default" (white == no override).
        EVENTS.forEach(evt => {
            const def = evtEl(evt, 'colordef');
            if (def) def.addEventListener('click', () => { evtEl(evt, 'color').value = '#ffffff'; });
        });

        // Defaults applied when /api/overlay/settings can't be reached. They
        // mirror the OverlaySettings record so the dialog stays usable as a
        // local-only editor and the user can SEE that the API is broken
        // instead of silently getting nothing on click.
        const EVT_DEFAULT = { show: true, alarmEnabled: false, alarmLeadMinutes: 5, color: null };
        const DEFAULT_SETTINGS = Object.freeze({
            enabled: false,
            hideWhenIdle: false,
            screenIndex: -1,
            anchor: 'TopRight',
            margin: 12,
            opacity: 0.80,
            fontSize: 12,
            eventsEnabled: true,
            worldBoss: { ...EVT_DEFAULT, alarmEnabled: true },
            helltide: { ...EVT_DEFAULT },
            legion: { ...EVT_DEFAULT }
        });

        function showError(msg) {
            console.warn('[Overlay panel]', msg);
            els.error.textContent = msg;
            els.error.classList.add('show');
        }

        function clearError() {
            els.error.textContent = '';
            els.error.classList.remove('show');
        }

        function paintAnchor(value) {
            els.anchors.querySelectorAll('button').forEach(b => {
                b.classList.toggle('active', b.dataset.a === value);
            });
        }

        function applySettings(s) {
            current = s;
            els.enabled.checked = !!s.enabled;
            els.hideIdle.checked = !!s.hideWhenIdle;
            els.screen.value = s.screenIndex != null ? s.screenIndex : -1;
            els.margin.value = s.margin != null ? s.margin : DEFAULT_SETTINGS.margin;
            els.opacity.value = s.opacity != null ? s.opacity : DEFAULT_SETTINGS.opacity;
            els.fontSize.value = s.fontSize != null ? s.fontSize : DEFAULT_SETTINGS.fontSize;
            paintAnchor(s.anchor || DEFAULT_SETTINGS.anchor);

            els.eventsEnabled.checked = s.eventsEnabled !== false;
            EVENTS.forEach(evt => {
                const cfg = s[evt] || EVT_DEFAULT;
                evtEl(evt, 'show').checked = cfg.show !== false;
                evtEl(evt, 'alarm').checked = !!cfg.alarmEnabled;
                evtEl(evt, 'lead').value = cfg.alarmLeadMinutes != null ? cfg.alarmLeadMinutes : 5;
                evtEl(evt, 'color').value = rgbToHex(cfg.color) || '#ffffff';
            });
        }

        async function open() {
            // Always open the dialog, even if API calls fail — the user needs
            // to see something happen when they click. Errors are surfaced in
            // the inline banner above the form.
            clearError();
            let screensOk = true, settingsOk = true;

            try { await loadScreens(); }
            catch (e) { screensOk = false; console.warn('[Overlay panel] loadScreens failed:', e); }

            try { await loadSettings(); }
            catch (e) { settingsOk = false; console.warn('[Overlay panel] loadSettings failed:', e); }

            if (!settingsOk) {
                applySettings({ ...DEFAULT_SETTINGS });
                showError(
                    'Could not reach /api/overlay/settings — showing defaults. ' +
                    'Check that the overlay controller is registered in the build you are running.'
                );
            } else if (!screensOk) {
                showError('Could not list displays (/api/overlay/screens). Only "Primary (auto)" is available.');
            }

            els.backdrop.classList.add('open');
            loadEventsPreview();
        }

        function close() { els.backdrop.classList.remove('open'); }

        els.trigger && els.trigger.addEventListener('click', open);
        els.close.addEventListener('click', close);
        els.backdrop.addEventListener('click', e => {
            if (e.target === els.backdrop) close();
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && els.backdrop.classList.contains('open')) close();
        });

        els.anchors.addEventListener('click', e => {
            const btn = e.target.closest('button[data-a]');
            if (!btn || !current) return;
            current.anchor = btn.dataset.a;
            paintAnchor(current.anchor);
        });

        async function loadScreens() {
            const r = await fetch('/api/overlay/screens');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const list = await r.json();
            els.screen.innerHTML = '';
            const primary = document.createElement('option');
            primary.value = -1;
            primary.textContent = 'Primary (auto)';
            els.screen.appendChild(primary);
            list.forEach(s => {
                const o = document.createElement('option');
                o.value = s.index;
                o.textContent =
                    '#' + (s.index + 1) + ' ' + s.name + ' (' + s.width + '×' + s.height + ')' +
                    (s.isPrimary ? ' — primary' : '');
                els.screen.appendChild(o);
            });
        }

        async function loadSettings() {
            const r = await fetch('/api/overlay/settings');
            if (!r.ok) throw new Error('HTTP ' + r.status);
            applySettings(await r.json());
        }

        function setPreview(evt, text) { const el = previewEl(evt); if (el) el.textContent = text; }

        // Read-only reference: show the current live countdowns next to each event.
        async function loadEventsPreview() {
            EVENTS.forEach(evt => setPreview(evt, '…'));
            try {
                const r = await fetch('/api/overlay/events');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const d = await r.json();
                if (!d || !d.hasData) { EVENTS.forEach(evt => setPreview(evt, '—')); return; }
                setPreview('worldBoss', d.worldBoss
                    ? [d.worldBoss.name, d.worldBoss.zone, d.worldBoss.remaining].filter(Boolean).join(' · ') : '—');
                setPreview('helltide', d.helltide
                    ? (d.helltide.active ? 'active · ' : 'starts · ') + d.helltide.remaining : '—');
                setPreview('legion', d.legion ? d.legion.remaining : '—');
            } catch (e) {
                console.warn('[Overlay panel] events preview failed:', e);
                EVENTS.forEach(evt => setPreview(evt, ''));
            }
        }

        // Build one event's config for the save payload (white color == null override).
        function evtPayload(evt) {
            const hex = evtEl(evt, 'color').value;
            return {
                show: evtEl(evt, 'show').checked,
                alarmEnabled: evtEl(evt, 'alarm').checked,
                alarmLeadMinutes: parseInt(evtEl(evt, 'lead').value, 10) || 0,
                color: hex && hex.toLowerCase() !== '#ffffff' ? hexToRgb(hex) : null
            };
        }

        els.save.addEventListener('click', async () => {
            if (!current) return;
            els.saved.classList.remove('error');
            const payload = {
                enabled: els.enabled.checked,
                hideWhenIdle: els.hideIdle.checked,
                screenIndex: parseInt(els.screen.value, 10),
                anchor: current.anchor || 'TopRight',
                margin: parseFloat(els.margin.value),
                opacity: parseFloat(els.opacity.value),
                fontSize: parseFloat(els.fontSize.value),
                eventsEnabled: els.eventsEnabled.checked,
                worldBoss: evtPayload('worldBoss'),
                helltide: evtPayload('helltide'),
                legion: evtPayload('legion')
            };
            try {
                const r = await fetch('/api/overlay/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!r.ok) throw new Error('HTTP ' + r.status);
                current = await r.json();
                clearError();
                els.saved.textContent = 'Saved';
                els.saved.classList.add('show');
                setTimeout(() => els.saved.classList.remove('show'), 1300);
            } catch (e) {
                console.warn('[Overlay panel] save failed:', e);
                els.saved.textContent = 'Save failed';
                els.saved.classList.add('show', 'error');
                showError('Save failed: ' + e.message + '. The PUT to /api/overlay/settings did not succeed.');
                setTimeout(() => els.saved.classList.remove('show'), 2500);
            }
        });
    })();
</script>
