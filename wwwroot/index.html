<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestInScript</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        /* ── Reset & Base ─────────────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg0: #17130f;
            --bg1: #1e1915;
            --bg2: #262019;
            --bg3: #302820;
            --border: #3a2f26;
            --accent: #d97757;
            --accent2: #e9a088;
            --green: #6ba368;
            --red: #d96b5a;
            --text: #ede6dc;
            --muted: #9a8c7d;
            --ink: #20160f;
            --radius: 10px;
            --font: 'Segoe UI', system-ui, sans-serif;
            --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
        }

        html, body {
            height: 100%;
            background: var(--bg0);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
        }

        button {
            cursor: pointer;
            font-family: var(--font);
            font-size: 13px;
            border: none;
            border-radius: var(--radius);
            transition: filter .15s, background .15s;
        }

            button:hover {
                filter: brightness(1.15);
            }

            button:active {
                filter: brightness(0.9);
            }

        input, select {
            font-family: var(--font);
            font-size: 13px;
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 10px;
            outline: none;
            transition: border-color .15s;
        }

            input:focus, select:focus {
                border-color: var(--accent);
            }

        label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
        }

        /* ── Layout ───────────────────────────────────────────────────────── */
        #app {
            display: grid;
            grid-template-rows: 56px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        #header {
            background: var(--bg1);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
        }

            #header h1 {
                font-family: var(--font-display);
                font-size: 20px;
                font-weight: 700;
                letter-spacing: .02em;
                color: var(--accent);
            }

            #header .tagline {
                color: var(--muted);
                font-size: 12px;
            }

            #header .spacer {
                flex: 1;
            }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            flex-shrink: 0;
        }

            #status-dot.error {
                background: var(--red);
                box-shadow: 0 0 6px var(--red);
            }

        #status-label {
            font-size: 12px;
            color: var(--muted);
        }

        #btn-stop-all {
            background: var(--bg3);
            color: var(--red);
            padding: 6px 14px;
            border: 1px solid var(--border);
        }

        /* Global emergency-stop hotkey control (BACKLOG 1.1). */
        #panic-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: 8px;
        }

            #panic-bar .panic-label {
                color: var(--muted);
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: .05em;
            }

            #panic-key {
                background: var(--bg0);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 5px 10px;
                font-family: monospace;
                font-size: 13px;
                font-weight: 700;
                color: var(--accent2);
                min-width: 46px;
                text-align: center;
                letter-spacing: .04em;
            }

                #panic-key.off {
                    color: var(--muted);
                    font-weight: 400;
                }

            #panic-bar button {
                background: var(--bg3);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 5px 8px;
                font-size: 12px;
            }

                #panic-bar button.listening {
                    background: var(--accent);
                    color: var(--ink);
                    border-color: var(--accent);
                }

        #profile-bar {
            display: flex;
            align-items: center;
            gap: 6px;
        }

            #profile-bar .profile-label {
                color: var(--muted);
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: .05em;
            }

            #profile-select {
                background: var(--bg3);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                padding: 5px 8px;
                font-size: 12px;
                font-family: var(--font);
                max-width: 200px;
            }

            #profile-bar .profile-btn {
                background: var(--bg3);
                color: var(--muted);
                border: 1px solid var(--border);
                padding: 5px 9px;
                font-size: 13px;
                line-height: 1;
            }

                #profile-bar .profile-btn:hover {
                    color: var(--accent);
                }

        #main {
            display: grid;
            grid-template-columns: 340px 1fr;
            overflow: hidden;
        }

        /* ── Sidebar ──────────────────────────────────────────────────────── */
        #sidebar {
            background: var(--bg1);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

            /* Scripts fill all remaining height; the list scrolls only on true overflow. */
            #scripts-section {
                flex: 1 1 auto;
                min-height: 0;
            }

            /* Presets size to content up to a cap, so one preset no longer eats half the sidebar. */
            #presets-section {
                flex: 0 0 auto;
            }

                #presets-section .sidebar-list {
                    max-height: clamp(120px, 26vh, 260px);
                }

            .sidebar-section + .sidebar-section {
                border-top: 1px solid var(--border);
            }

        .sidebar-head {
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .sidebar-head span {
                flex: 1;
                font-family: var(--font-display);
                font-weight: 700;
                font-size: 15px;
                letter-spacing: .01em;
                color: var(--text);
            }

        #btn-new, #btn-new-preset {
            background: var(--accent);
            color: var(--ink);
            padding: 7px 14px;
            font-weight: 700;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 8px 8px;
        }

            .sidebar-list::-webkit-scrollbar {
                width: 4px;
            }

            .sidebar-list::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 4px;
            }

        /* Preset card mirrors script card but tinted */
        .preset-card .key-badge {
            color: var(--green) !important;
        }

        .preset-card .meta-members {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* Member checklist on the preset editor */
        .member-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 360px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            background: var(--bg0);
        }

        .member-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 9px;
            border-radius: 5px;
            background: var(--bg2);
            border: 1px solid transparent;
            cursor: pointer;
            transition: border-color .12s, background .12s;
        }

            .member-row:hover {
                border-color: var(--accent);
            }

            .member-row.checked {
                border-color: var(--accent);
                background: var(--bg3);
            }

            .member-row input[type=checkbox] {
                width: 16px;
                height: 16px;
                accent-color: var(--accent);
                margin: 0;
                cursor: pointer;
            }

            .member-row .name {
                flex: 1;
                font-weight: 600;
                font-size: 13px;
            }

            .member-row .key {
                font-family: monospace;
                font-size: 11px;
                color: var(--accent2);
                background: var(--bg0);
                padding: 2px 8px;
                border-radius: 4px;
                border: 1px solid var(--border);
            }

        .script-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 11px;
            margin-bottom: 5px;
            cursor: pointer;
            transition: border-color .15s, background .15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .script-card:hover {
                border-color: var(--accent);
                background: var(--bg3);
            }

            .script-card.selected {
                border-color: var(--accent);
                background: var(--bg3);
            }

            .script-card .key-badge {
                background: var(--bg0);
                border: 1px solid var(--border);
                border-radius: 5px;
                padding: 3px 7px;
                font-size: 12px;
                font-weight: 700;
                color: var(--accent2);
                min-width: 30px;
                text-align: center;
                font-family: monospace;
                flex-shrink: 0;
            }

            .script-card .info {
                flex: 1;
                min-width: 0;
            }

            .script-card .name {
                font-weight: 600;
                font-size: 13px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .script-card .meta {
                font-size: 11px;
                color: var(--muted);
                margin-top: 2px;
            }

            .script-card .running-pill {
                background: #29331f;
                color: var(--green);
                border: 1px solid #47562f;
                border-radius: 20px;
                font-size: 10px;
                padding: 2px 8px;
                font-weight: 700;
                letter-spacing: .04em;
                flex-shrink: 0;
            }

        .empty-state {
            color: var(--muted);
            text-align: center;
            padding: 32px 16px;
            font-size: 13px;
            line-height: 1.6;
        }

        /* ── Editor ───────────────────────────────────────────────────────── */
        #editor {
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

            #editor::-webkit-scrollbar {
                width: 5px;
            }

            #editor::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 4px;
            }

        .panel {
            background: var(--bg1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px;
            width: 100%;
            max-width: 960px;
            align-self: center;
        }

        .panel-title {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: .01em;
            color: var(--text);
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

            .form-group.full {
                grid-column: 1 / -1;
            }

            .form-group input, .form-group select {
                width: 100%;
            }

        /* Key capture */
        #trigger-capture {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #trigger-display {
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 14px;
            font-family: monospace;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent2);
            min-width: 70px;
            text-align: center;
            letter-spacing: .05em;
        }

        #btn-capture {
            background: var(--bg3);
            color: var(--text);
            padding: 7px 14px;
            border: 1px solid var(--border);
        }

            #btn-capture.listening {
                background: var(--accent);
                color: var(--ink);
                border-color: var(--accent);
            }

        /* Delay sliders */
        .delay-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            align-items: end;
        }

        .delay-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .delay-group .val {
                font-family: monospace;
                font-size: 13px;
                color: var(--accent2);
                text-align: right;
            }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--bg3);
            border-radius: 2px;
            outline: none;
            border: none;
            padding: 0;
        }

            input[type=range]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                background: var(--accent);
                border-radius: 50%;
                cursor: pointer;
                box-shadow: 0 0 4px rgba(217,119,87,.5);
            }

        /* Steps builder */
        #steps-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .step-number {
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 2px 9px;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            font-family: monospace;
        }

        .step-header span {
            flex: 1;
        }

        .btn-remove-step {
            background: var(--bg3);
            color: var(--red);
            padding: 4px 10px;
            font-size: 12px;
            border: 1px solid var(--border);
        }

        .step-section {
            margin-bottom: 10px;
        }

            .step-section label {
                font-size: 11px;
                color: var(--muted);
                margin-bottom: 6px;
            }

        .key-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
        }

        .key-chip {
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 3px 8px;
            font-family: monospace;
            font-size: 12px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 5px;
        }

            .key-chip button {
                background: none;
                color: var(--muted);
                font-size: 14px;
                padding: 0;
                line-height: 1;
                border-radius: 0;
            }

                .key-chip button:hover {
                    color: var(--red);
                }

        .add-key-row {
            display: flex;
            gap: 6px;
        }

            .add-key-row input {
                flex: 1;
            }

        .btn-add-key {
            background: var(--bg3);
            color: var(--text);
            padding: 6px 12px;
            border: 1px solid var(--border);
        }

        #btn-add-step {
            background: var(--bg3);
            color: var(--text);
            padding: 8px 16px;
            border: 1px dashed var(--border);
            width: 100%;
            margin-top: 4px;
        }

            #btn-add-step:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

        /* Action bar */
        .action-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            max-width: 960px;
            align-self: center;
        }

            .action-bar .spacer {
                flex: 1;
            }

        #btn-save {
            background: var(--accent);
            color: var(--ink);
            font-weight: 700;
            padding: 9px 22px;
        }

        #btn-delete {
            background: var(--bg3);
            color: var(--red);
            padding: 9px 18px;
            border: 1px solid var(--border);
        }

        .no-script {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            gap: 12px;
        }

            .no-script .icon {
                font-size: 48px;
                opacity: .3;
            }

            .no-script p {
                font-size: 14px;
            }

        /* Toast */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            pointer-events: none;
        }

        .toast {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            font-size: 13px;
            max-width: 320px;
            animation: slideIn .2s ease;
        }

            .toast.success {
                border-left: 3px solid var(--green);
            }

            .toast.error {
                border-left: 3px solid var(--red);
            }

        @keyframes slideIn {
            from {
                transform: translateX(20px);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        /* Key autocomplete dropdown */
        .key-input-wrap {
            position: relative;
        }

        .ac-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg2);
            border: 1px solid var(--accent);
            border-radius: 6px;
            z-index: 50;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 2px;
        }

            .ac-list div {
                padding: 6px 10px;
                font-family: monospace;
                font-size: 12px;
                cursor: pointer;
            }

                .ac-list div:hover, .ac-list div.active {
                    background: var(--bg3);
                    color: var(--accent2);
                }

        /* ── Pixel Trigger panel ──────────────────────────────────────────── */
        .pt-toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .switch {
            position: relative;
            width: 42px;
            height: 23px;
            flex-shrink: 0;
        }

            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .switch .slider {
                position: absolute;
                inset: 0;
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: 23px;
                transition: background .15s;
            }

                .switch .slider::before {
                    content: '';
                    position: absolute;
                    width: 17px;
                    height: 17px;
                    left: 2px;
                    top: 2px;
                    background: var(--muted);
                    border-radius: 50%;
                    transition: transform .15s, background .15s;
                }

            .switch input:checked + .slider {
                background: var(--accent);
                border-color: var(--accent);
            }

                .switch input:checked + .slider::before {
                    transform: translateX(19px);
                    background: var(--ink);
                }

        .pt-disabled-note {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
            margin-top: 14px;
        }

        .pt-body {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .pt-sub {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .pt-sub-title {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .01em;
            color: var(--text);
            margin-bottom: 12px;
        }

        .pt-coord-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

            .pt-coord-row .form-group {
                min-width: 90px;
            }

        .btn-sample {
            background: var(--bg3);
            color: var(--text);
            padding: 7px 13px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

            .btn-sample.counting {
                background: var(--accent);
                color: var(--ink);
                border-color: var(--accent);
            }

            .btn-sample:disabled {
                opacity: .4;
                cursor: not-allowed;
            }

        .pt-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.5;
        }

        .pt-color-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .pt-color-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pt-swatch-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pt-swatch {
            width: 46px;
            height: 46px;
            border-radius: 6px;
            border: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg0);
        }

        .pt-rgb {
            font-family: monospace;
            font-size: 12px;
            color: var(--text);
            line-height: 1.5;
        }

            .pt-rgb .muted {
                color: var(--muted);
            }

        .pt-live-readout {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
        }

        .pt-verdict {
            font-family: monospace;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: .04em;
            white-space: nowrap;
        }

            .pt-verdict.ready {
                background: #29331f;
                color: var(--green);
                border: 1px solid #47562f;
            }

            .pt-verdict.waiting {
                background: #3a2d1a;
                color: var(--accent2);
                border: 1px solid #5e4a2e;
            }

            .pt-verdict.nomatch {
                background: #3d1d1d;
                color: var(--red);
                border: 1px solid #663030;
            }

            .pt-verdict.offline {
                background: var(--bg3);
                color: var(--muted);
                border: 1px solid var(--border);
            }
    </style>
</head>
<body>
    <div id="app">

        <!-- Header -->
        <header id="header">
            <h1>⚔ BestInScript</h1>
            <span class="tagline">ARPG Macro Engine</span>
            <div class="spacer"></div>
            <div id="profile-bar">
                <span class="profile-label">Profile</span>
                <select id="profile-select" onchange="switchProfile(this.value)"
                        title="Active config profile"></select>
                <button class="profile-btn" onclick="createProfile()" title="New profile">+</button>
                <button class="profile-btn" onclick="renameProfile()" title="Rename active profile">✎</button>
                <button class="profile-btn" onclick="deleteProfile()" title="Delete a profile">🗑</button>
            </div>
            <div id="status-dot"></div>
            <span id="status-label">Checking…</span>
            <div id="panic-bar" title="Global emergency-stop hotkey — press it anywhere to stop all scripts">
                <span class="panic-label">Panic</span>
                <span id="panic-key" class="off">off</span>
                <button id="panic-capture" type="button">Set</button>
                <button id="panic-clear" type="button" title="Disable the panic hotkey">✕</button>
            </div>
            <button id="btn-stop-all">■ Stop All</button>
        </header>

        <!-- Body -->
        <div id="main">

            <!-- Sidebar -->
            <aside id="sidebar">
                <div class="sidebar-section" id="scripts-section">
                    <div class="sidebar-head">
                        <span>Scripts</span>
                        <button id="btn-new">+ New</button>
                    </div>
                    <div id="script-list" class="sidebar-list"></div>
                </div>
                <div class="sidebar-section" id="presets-section">
                    <div class="sidebar-head">
                        <span>Presets</span>
                        <button id="btn-new-preset">+ New</button>
                    </div>
                    <div id="preset-list" class="sidebar-list"></div>
                </div>
            </aside>

            <!-- Editor -->
            <main id="editor">
                <div class="no-script" id="no-script">
                    <div class="icon">🎮</div>
                    <p>Select a script or click <strong>+ New</strong> to create one.</p>
                </div>
                <!-- editor content injected by JS -->
            </main>

        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // ── Constants ────────────────────────────────────────────────────────────────
        const API = `${window.location.origin}/api`;

        const ALL_KEYS = [
            ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
            ...Array.from({ length: 10 }, (_, i) => String(i)),
            ...Array.from({ length: 12 }, (_, i) => `F${i + 1}`),
            ...Array.from({ length: 10 }, (_, i) => `NumPad${i}`),
            'Space', 'Enter', 'Tab', 'Escape', 'Pause', 'Backspace', 'Delete', 'Insert',
            'Home', 'End', 'PageUp', 'PageDown', 'Up', 'Down', 'Left', 'Right',
            'Shift', 'LShift', 'RShift', 'Ctrl', 'LCtrl', 'RCtrl', 'Alt', 'LAlt', 'RAlt',
            'Multiply', 'Add', 'Subtract', 'Decimal', 'Divide',
            'Mouse1', 'Mouse2', 'Mouse3', 'Mouse4', 'Mouse5'
        ];

        const TRIGGER_KEYS = ALL_KEYS.filter(k => !k.startsWith('Mouse'));

        // ── State ────────────────────────────────────────────────────────────────────
        let scripts = [];
        let statuses = {};

        let presets = [];
        let presetStatuses = {};

        // Config profiles (per character/build/season).
        let profileNames = [];
        let activeProfile = '';

        // The thing currently in the editor.
        //   selectedKind: 'script' | 'preset' | null
        //   selected:     ScriptConfig or Preset object (always a deep copy)
        let selected = null;
        let selectedKind = null;
        let isNew = false;
        let capturing = false;

        // Pixel-trigger UI state
        let pixelLiveTimer = null;   // setInterval handle for the live readout
        let sampleBusy = false;      // a countdown sample is in progress

        // Guided in-game capture state
        let captureTimer = null;     // setInterval handle for the capture-state poll
        let captureArmed = false;    // a guided in-game capture is currently armed
        let captureHotkey = 'F8';    // chosen capture hotkey
        let captureListening = false;// listening for a keypress to set the hotkey
        let lastCaptureSeq = -1;     // last "Done" seq already applied to the form
        let lastCaptureState = null; // most recent capture-state snapshot (drives status + nudge)

        // ── Bootstrap ────────────────────────────────────────────────────────────────
        (async () => {
            await loadProfiles();
            await loadScripts();
            await loadPresets();
            renderSidebar();
            showNoScript();
            pollStatus();
        })();

        // ── Data ─────────────────────────────────────────────────────────────────────
        async function loadScripts() {
            try {
                const r = await fetch(`${API}/scripts`);
                scripts = await r.json();
            } catch { scripts = []; }
        }

        async function loadPresets() {
            try {
                const r = await fetch(`${API}/presets`);
                presets = await r.json();
            } catch { presets = []; }
        }

        // ── Profiles ───────────────────────────────────────────────────────────────────
        async function loadProfiles() {
            try {
                const r = await fetch(`${API}/profiles`);
                const data = await r.json();
                profileNames = data.profiles || [];
                activeProfile = data.active || '';
            } catch { profileNames = []; activeProfile = ''; }
            renderProfileSelect();
        }

        function renderProfileSelect() {
            const sel = document.getElementById('profile-select');
            if (!sel) return;
            sel.innerHTML = profileNames.map(n =>
                `<option value="${esc(n)}"${n === activeProfile ? ' selected' : ''}>${esc(n)}</option>`
            ).join('');
        }

        // Switch active profile: the server stops running scripts and loads the new
        // config, so we reload every list and clear the editor.
        async function switchProfile(name) {
            if (!name || name === activeProfile) return;
            try {
                const r = await fetch(`${API}/profiles/${encodeURIComponent(name)}/activate`, { method: 'POST' });
                if (!r.ok) { toast(await r.text(), 'error'); await loadProfiles(); return; }
                await loadProfiles();
                await loadScripts();
                await loadPresets();
                renderSidebar();
                showNoScript();
                toast(`Switched to profile "${name}"`);
            } catch (e) {
                toast('Switch failed: ' + e.message, 'error');
                await loadProfiles();   // reset the dropdown to the real active profile
            }
        }

        async function createProfile() {
            const name = prompt('New profile name:');
            if (name === null) return;
            const trimmed = name.trim();
            if (!trimmed) return;
            const copyFromCurrent = confirm(
                `Copy scripts + presets from the current profile ("${activeProfile}") into "${trimmed}"?\n\n` +
                `OK = copy (recommended for a new season of the same build)\n` +
                `Cancel = start empty`);
            try {
                const r = await fetch(`${API}/profiles`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: trimmed, copyFromCurrent })
                });
                if (!r.ok) { toast(await r.text(), 'error'); return; }
                await loadProfiles();
                toast(`Profile "${trimmed}" created — pick it from the dropdown to switch`);
            } catch (e) { toast('Create failed: ' + e.message, 'error'); }
        }

        async function renameProfile() {
            const current = activeProfile;
            const name = prompt(`Rename the active profile "${current}" to:`, current);
            if (name === null) return;
            const trimmed = name.trim();
            if (!trimmed || trimmed === current) return;
            try {
                const r = await fetch(`${API}/profiles/${encodeURIComponent(current)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newName: trimmed })
                });
                if (!r.ok) { toast(await r.text(), 'error'); return; }
                await loadProfiles();
                toast(`Renamed to "${trimmed}"`);
            } catch (e) { toast('Rename failed: ' + e.message, 'error'); }
        }

        async function deleteProfile() {
            const others = profileNames.filter(n => n !== activeProfile);
            if (others.length === 0) {
                toast('The active profile cannot be deleted, and there is no other profile.', 'error');
                return;
            }
            const name = prompt(
                `Delete which profile?\nAvailable: ${others.join(', ')}\n` +
                `(The active profile "${activeProfile}" cannot be deleted.)`);
            if (name === null) return;
            const trimmed = name.trim();
            if (!trimmed) return;
            if (!confirm(`Permanently delete profile "${trimmed}" and its scripts + presets? This cannot be undone.`))
                return;
            try {
                const r = await fetch(`${API}/profiles/${encodeURIComponent(trimmed)}`, { method: 'DELETE' });
                if (!r.ok) { toast(await r.text(), 'error'); return; }
                await loadProfiles();
                toast(`Deleted profile "${trimmed}"`);
            } catch (e) { toast('Delete failed: ' + e.message, 'error'); }
        }

        async function pollStatus() {
            try {
                const [sr, pr] = await Promise.all([
                    fetch(`${API}/engine/status`),
                    fetch(`${API}/presets/status`)
                ]);
                const scriptList = await sr.json();
                const presetList = await pr.json();
                statuses = {};
                scriptList.forEach(s => statuses[s.id] = s.isRunning);
                presetStatuses = {};
                presetList.forEach(p => presetStatuses[p.id] = p.isActive);
                document.getElementById('status-dot').classList.remove('error');
                document.getElementById('status-label').textContent = 'Engine running';
                renderSidebarCards();
            } catch {
                document.getElementById('status-dot').classList.add('error');
                document.getElementById('status-label').textContent = 'API offline';
            }
            setTimeout(pollStatus, 2000);
        }

        // ── Sidebar ───────────────────────────────────────────────────────────────────
        function renderSidebar() {
            renderSidebarCards();
        }

        function renderSidebarCards() {
            renderScriptCards();
            renderPresetCards();
        }

        function renderScriptCards() {
            const el = document.getElementById('script-list');
            if (!scripts.length) {
                el.innerHTML = '<div class="empty-state">No scripts yet.<br>Click <strong>+ New</strong> to get started.</div>';
                return;
            }
            el.innerHTML = scripts.map(s => {
                const running = !!statuses[s.id];
                const sel = selectedKind === 'script' && selected && selected.id === s.id ? 'selected' : '';
                const pixelTag = s.pixelTrigger ? ' · 👁 pixel' : '';
                const overlayTag = s.showInOverlay ? ` · ${s.overlayIcon ? esc(s.overlayIcon) : '📺'} overlay` : '';
                return `
          <div class="script-card ${sel}" data-id="${s.id}" onclick="selectScript('${s.id}')">
            <div class="key-badge">${esc(s.triggerKey)}</div>
            <div class="info">
              <div class="name">${esc(s.name)}</div>
              <div class="meta">${s.steps.length} step${s.steps.length !== 1 ? 's' : ''} · ${s.delayMin}–${s.delayMax}s${pixelTag}${overlayTag}</div>
            </div>
            ${running ? '<div class="running-pill">● ON</div>' : ''}
          </div>`;
            }).join('');
        }

        function renderPresetCards() {
            const el = document.getElementById('preset-list');
            if (!presets.length) {
                el.innerHTML = '<div class="empty-state">No presets yet.<br>Click <strong>+ New</strong> to group scripts.</div>';
                return;
            }
            el.innerHTML = presets.map(p => {
                const active = !!presetStatuses[p.id];
                const sel = selectedKind === 'preset' && selected && selected.id === p.id ? 'selected' : '';
                const overlayTag = p.showInOverlay ? ` · ${p.overlayIcon ? esc(p.overlayIcon) : '📺'} overlay` : '';
                const count = (p.scriptIds || []).length;
                return `
          <div class="script-card preset-card ${sel}" data-id="${p.id}" onclick="selectPreset('${p.id}')">
            <div class="key-badge">${esc(p.triggerKey)}</div>
            <div class="info">
              <div class="name">${esc(p.name)}</div>
              <div class="meta">${count} script${count !== 1 ? 's' : ''}${overlayTag}</div>
            </div>
            ${active ? '<div class="running-pill">● ON</div>' : ''}
          </div>`;
            }).join('');
        }

        // ── Selection ─────────────────────────────────────────────────────────────────
        function selectScript(id) {
            const s = scripts.find(x => x.id === id);
            if (!s) return;
            stopPixelLive();
            isNew = false;
            selectedKind = 'script';
            selected = JSON.parse(JSON.stringify(s)); // deep copy
            renderEditor();
        }

        function newScript() {
            stopPixelLive();
            isNew = true;
            selectedKind = 'script';
            selected = {
                id: null, name: 'New Script', triggerKey: '3',
                steps: [{ hold: [], press: [] }], delayMin: 0.4, delayMax: 0.6,
                pixelTrigger: null,
                showInOverlay: false,
                overlayColor: null, overlayIcon: null
            };
            renderEditor();
        }

        function selectPreset(id) {
            const p = presets.find(x => x.id === id);
            if (!p) return;
            stopPixelLive();
            isNew = false;
            selectedKind = 'preset';
            selected = JSON.parse(JSON.stringify(p));
            if (!Array.isArray(selected.scriptIds)) selected.scriptIds = [];
            renderEditor();
        }

        function newPreset() {
            stopPixelLive();
            isNew = true;
            selectedKind = 'preset';
            selected = {
                id: null,
                name: 'New Preset',
                triggerKey: 'F1',
                scriptIds: [],
                showInOverlay: false,
                overlayColor: null, overlayIcon: null
            };
            renderEditor();
        }

        function showNoScript() {
            stopPixelLive();
            selected = null;
            selectedKind = null;
            document.getElementById('no-script').style.display = 'flex';
            // remove any injected panels
            document.querySelectorAll('#editor .panel, #editor .action-bar').forEach(el => el.remove());
        }

        // ── Editor render ─────────────────────────────────────────────────────────────
        function renderEditor() {
            if (selectedKind === 'preset') { renderPresetEditor(); return; }
            renderScriptEditor();
        }

        function renderScriptEditor() {
            // Any live readout belongs to the previous render's DOM — kill it first.
            stopPixelLive();

            const noScript = document.getElementById('no-script');
            noScript.style.display = 'none';

            // Clear old panels
            document.querySelectorAll('#editor .panel, #editor .action-bar').forEach(el => el.remove());

            const editor = document.getElementById('editor');

            // ── Basic settings panel ──
            const basic = mkPanel('Basic Settings', `
        <div class="form-row">
          <div class="form-group full">
            <label>Script Name</label>
            <input id="f-name" type="text" value="${esc(selected.name)}" placeholder="e.g. Hammerwing Rotation" />
          </div>

          <div class="form-group">
            <label>Trigger Key <span style="color:var(--muted);font-weight:400;text-transform:none">(keyboard only)</span></label>
            <div id="trigger-capture">
              <div id="trigger-display">${esc(selected.triggerKey)}</div>
              <button id="btn-capture" onclick="startCapture()">Click to Capture</button>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:5px">Press this key in-game to toggle the script on/off.</div>
          </div>

          <div class="form-group">
            <label>Delay Between Steps</label>
            <div class="delay-row">
              <div class="delay-group">
                <label style="margin-bottom:2px">Min <span class="val" id="lbl-dmin">${selected.delayMin}s</span></label>
                <input id="f-dmin" type="range" min="0.1" max="5" step="0.05"
                  value="${selected.delayMin}" oninput="syncDelay()" />
              </div>
              <div class="delay-group">
                <label style="margin-bottom:2px">Max <span class="val" id="lbl-dmax">${selected.delayMax}s</span></label>
                <input id="f-dmax" type="range" min="0.1" max="5" step="0.05"
                  value="${selected.delayMax}" oninput="syncDelay()" />
              </div>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:5px">Each step waits a random time in this window. Randomness avoids detection.</div>
          </div>

          <div class="form-group full" style="margin-top:8px;padding-top:14px;border-top:1px solid var(--border)">
            <div class="pt-toggle-row">
              <label class="switch">
                <input type="checkbox" id="f-show-overlay" ${selected.showInOverlay ? 'checked' : ''}
                  onchange="syncShowOverlay(this.checked)" />
                <span class="slider"></span>
              </label>
              <div>
                <div style="font-weight:600;font-size:13px;color:var(--text)">
                  Show in on-screen overlay
                </div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5">
                  Surface this script in the desktop overlay while it's toggled on.
                  Pixel-triggered scripts show their live state (READY / waiting /
                  unreadable); regular scripts show as ON.
                </div>
              </div>
            </div>
            ${overlayStyleFieldsHtml()}
          </div>
        </div>
      `);
            editor.appendChild(basic);

            // ── Pixel trigger panel ──
            const pixelPanel = mkPanel('Pixel Trigger — Autocast', `
        <div class="pt-toggle-row">
          <label class="switch">
            <input type="checkbox" id="pt-enable" ${selected.pixelTrigger ? 'checked' : ''}
              onchange="togglePixelTrigger(this.checked)" />
            <span class="slider"></span>
          </label>
          <div>
            <div style="font-weight:600;font-size:13px;color:var(--text)">
              Only run while a screen pixel matches a “ready” color
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">
              Watches a skill icon and fires the steps the moment it comes off cooldown.
            </div>
          </div>
        </div>
        <div id="pt-body-wrap"></div>
      `);
            editor.appendChild(pixelPanel);
            renderPixelPanel();

            // ── Steps panel ──
            const stepsPanel = mkPanel('Script Steps', `
        <div style="font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6">
          Each step: hold keys are pressed down → press keys are tapped → hold keys no longer
          needed are released → random delay. A hold key shared by consecutive steps stays
          down instead of fluttering. Steps loop while the script is active (or run once per
          “ready” detection when a pixel trigger is set).
        </div>
        <div id="steps-list"></div>
        <button id="btn-add-step" onclick="addStep()">+ Add Step</button>
      `);
            editor.appendChild(stepsPanel);

            renderSteps();

            // ── Action bar ──
            const bar = document.createElement('div');
            bar.className = 'action-bar';
            bar.innerHTML = `
        <button id="btn-delete" onclick="deleteScript()" ${isNew ? 'style="display:none"' : ''}>🗑 Delete</button>
        <div class="spacer"></div>
        <button id="btn-save" onclick="saveScript()">💾 Save Script</button>
      `;
            editor.appendChild(bar);

            // Highlight selected card
            renderSidebarCards();
        }

        function mkPanel(title, html) {
            const d = document.createElement('div');
            d.className = 'panel';
            d.innerHTML = `<div class="panel-title">${title}</div>${html}`;
            return d;
        }

        // ── Preset editor ─────────────────────────────────────────────────────────────
        function renderPresetEditor() {
            stopPixelLive();

            const noScript = document.getElementById('no-script');
            noScript.style.display = 'none';
            document.querySelectorAll('#editor .panel, #editor .action-bar').forEach(el => el.remove());

            const editor = document.getElementById('editor');

            const basic = mkPanel('Preset Settings', `
        <div class="form-row">
          <div class="form-group full">
            <label>Preset Name <span style="color:var(--muted);font-weight:400;text-transform:none">(this is the save name)</span></label>
            <input id="f-name" type="text" value="${esc(selected.name)}" placeholder="e.g. Boss DPS" />
          </div>

          <div class="form-group">
            <label>Trigger Key <span style="color:var(--muted);font-weight:400;text-transform:none">(keyboard only)</span></label>
            <div id="trigger-capture">
              <div id="trigger-display">${esc(selected.triggerKey)}</div>
              <button id="btn-capture" onclick="startCapture()">Click to Capture</button>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:5px">Press this key in-game to toggle every member script as a group.</div>
          </div>

          <div class="form-group full" style="margin-top:8px;padding-top:14px;border-top:1px solid var(--border)">
            <div class="pt-toggle-row">
              <label class="switch">
                <input type="checkbox" id="f-show-overlay" ${selected.showInOverlay ? 'checked' : ''}
                  onchange="syncShowOverlay(this.checked)" />
                <span class="slider"></span>
              </label>
              <div>
                <div style="font-weight:600;font-size:13px;color:var(--text)">
                  Show in on-screen overlay
                </div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5">
                  Surface this preset as a row on the desktop overlay while it's active.
                </div>
              </div>
            </div>
            ${overlayStyleFieldsHtml()}
          </div>
        </div>
      `);
            editor.appendChild(basic);

            const membersPanel = mkPanel('Member Scripts', `
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6">
          Activating this preset starts every checked script as if you pressed its trigger key.
          Deactivating releases this preset's claim — a script keeps running if any other
          preset (or your direct keypress) still wants it on.
        </div>
        <div id="member-list" class="member-list"></div>
      `);
            editor.appendChild(membersPanel);
            renderMemberList();

            const bar = document.createElement('div');
            bar.className = 'action-bar';
            bar.innerHTML = `
        <button id="btn-delete" onclick="deletePreset()" ${isNew ? 'style="display:none"' : ''}>🗑 Delete</button>
        <div class="spacer"></div>
        <button id="btn-save" onclick="savePreset()">💾 Save Preset</button>
      `;
            editor.appendChild(bar);

            renderSidebarCards();
        }

        function renderMemberList() {
            const list = document.getElementById('member-list');
            if (!list) return;
            if (!scripts.length) {
                list.innerHTML = '<div class="empty-state" style="padding:18px">No scripts to group. Create some scripts first.</div>';
                return;
            }
            const owned = new Set(selected.scriptIds || []);
            list.innerHTML = scripts.map(s => {
                const checked = owned.has(s.id);
                return `
          <label class="member-row ${checked ? 'checked' : ''}" data-id="${s.id}">
            <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleMember('${s.id}', this.checked)" />
            <div class="name">${esc(s.name)}</div>
            <div class="key">${esc(s.triggerKey)}</div>
          </label>`;
            }).join('');
        }

        function toggleMember(id, on) {
            const set = new Set(selected.scriptIds || []);
            if (on) set.add(id); else set.delete(id);
            selected.scriptIds = [...set];
            renderMemberList();
        }

        // ── Steps rendering ────────────────────────────────────────────────────────────
        function renderSteps() {
            const list = document.getElementById('steps-list');
            if (!list) return;
            list.innerHTML = '';
            selected.steps.forEach((step, i) => {
                const card = document.createElement('div');
                card.className = 'step-card';
                card.dataset.idx = i;
                card.innerHTML = `
          <div class="step-header">
            <span class="step-number">STEP ${i + 1}</span>
            <span></span>
            <button class="btn-remove-step" onclick="removeStep(${i})">✕ Remove</button>
          </div>
          <div class="step-section">
            <label>Hold Keys <span style="font-weight:400;text-transform:none;color:var(--muted)">(held down for entire step)</span></label>
            <div class="key-chips" id="hold-chips-${i}"></div>
            <div class="add-key-row">
              <div class="key-input-wrap" style="flex:1">
                <input id="hold-input-${i}" type="text" placeholder="e.g. Shift, Ctrl" autocomplete="off"
                  oninput="showAC(this,'hold',${i})" onkeydown="keyInputDown(event,'hold',${i})" />
                <div class="ac-list" id="hold-ac-${i}" style="display:none"></div>
              </div>
              <button class="btn-add-key" onclick="addKey('hold',${i})">+ Add</button>
            </div>
          </div>
          <div class="step-section" style="margin-bottom:0">
            <label>Press Keys <span style="font-weight:400;text-transform:none;color:var(--muted)">(tap once per step)</span></label>
            <div class="key-chips" id="press-chips-${i}"></div>
            <div class="add-key-row">
              <div class="key-input-wrap" style="flex:1">
                <input id="press-input-${i}" type="text" placeholder="e.g. Mouse1, Q, E" autocomplete="off"
                  oninput="showAC(this,'press',${i})" onkeydown="keyInputDown(event,'press',${i})" />
                <div class="ac-list" id="press-ac-${i}" style="display:none"></div>
              </div>
              <button class="btn-add-key" onclick="addKey('press',${i})">+ Add</button>
            </div>
          </div>
        `;
                list.appendChild(card);
                renderChips('hold', i);
                renderChips('press', i);
            });
        }

        function renderChips(type, idx) {
            const step = selected.steps[idx];
            const arr = type === 'hold' ? step.hold : step.press;
            const el = document.getElementById(`${type}-chips-${idx}`);
            if (!el) return;
            el.innerHTML = arr.map((k, ki) => `
        <div class="key-chip">
          <span>${esc(k)}</span>
          <button onclick="removeKey('${type}',${idx},${ki})">×</button>
        </div>`).join('');
        }

        function addStep() {
            selected.steps.push({ hold: [], press: [] });
            renderSteps();
        }

        function removeStep(idx) {
            selected.steps.splice(idx, 1);
            renderSteps();
        }

        function addKey(type, idx) {
            const input = document.getElementById(`${type}-input-${idx}`);
            const val = input.value.trim();
            if (!val) return;
            const normalized = val.toUpperCase() === val ? val : val.charAt(0).toUpperCase() + val.slice(1);
            const match = ALL_KEYS.find(k => k.toUpperCase() === normalized.toUpperCase());
            if (!match) { toast(`Unknown key: ${val}`, 'error'); return; }
            const arr = type === 'hold' ? selected.steps[idx].hold : selected.steps[idx].press;
            if (!arr.includes(match)) arr.push(match);
            input.value = '';
            closeAC(type, idx);
            renderChips(type, idx);
        }

        function removeKey(type, idx, ki) {
            const arr = type === 'hold' ? selected.steps[idx].hold : selected.steps[idx].press;
            arr.splice(ki, 1);
            renderChips(type, idx);
        }

        function keyInputDown(e, type, idx) {
            const acId = `${type}-ac-${idx}`;
            const ac = document.getElementById(acId);
            if (e.key === 'Enter') { addKey(type, idx); return; }
            if (e.key === 'Escape') { closeAC(type, idx); return; }
            if (ac && ac.style.display !== 'none') {
                const items = ac.querySelectorAll('div');
                const cur = ac.querySelector('div.active');
                let idx2 = [...items].indexOf(cur);
                if (e.key === 'ArrowDown') { e.preventDefault(); idx2 = Math.min(idx2 + 1, items.length - 1); }
                if (e.key === 'ArrowUp') { e.preventDefault(); idx2 = Math.max(idx2 - 1, 0); }
                items.forEach((it, i) => it.classList.toggle('active', i === idx2));
                if (cur) cur.scrollIntoView({ block: 'nearest' });
            }
        }

        // ── Autocomplete ──────────────────────────────────────────────────────────────
        function showAC(input, type, idx) {
            const q = input.value.trim().toUpperCase();
            const acEl = document.getElementById(`${type}-ac-${idx}`);
            if (!q) { acEl.style.display = 'none'; return; }
            const matches = ALL_KEYS.filter(k => k.toUpperCase().startsWith(q)).slice(0, 10);
            if (!matches.length) { acEl.style.display = 'none'; return; }
            acEl.innerHTML = matches.map(k =>
                `<div onclick="pickAC('${k}','${type}',${idx})">${k}</div>`).join('');
            acEl.style.display = 'block';
        }

        function pickAC(key, type, idx) {
            document.getElementById(`${type}-input-${idx}`).value = key;
            closeAC(type, idx);
            addKey(type, idx);
        }

        function closeAC(type, idx) {
            const el = document.getElementById(`${type}-ac-${idx}`);
            if (el) el.style.display = 'none';
        }

        // ── Trigger key capture ────────────────────────────────────────────────────────
        function startCapture() {
            if (capturing) return;
            capturing = true;
            const btn = document.getElementById('btn-capture');
            const dis = document.getElementById('trigger-display');
            btn.classList.add('listening');
            btn.textContent = '⌨ Press any key…';
            dis.textContent = '…';

            function onKey(e) {
                e.preventDefault();
                e.stopPropagation();
                // Map key event to our key name
                const name = mapEventKey(e);
                if (!name || !TRIGGER_KEYS.includes(name)) {
                    toast('Invalid trigger key (mouse buttons not allowed here)', 'error');
                    reset();
                    return;
                }
                selected.triggerKey = name;
                dis.textContent = name;
                reset();
            }

            function reset() {
                capturing = false;
                btn.classList.remove('listening');
                btn.textContent = 'Click to Capture';
                document.removeEventListener('keydown', onKey, true);
            }

            document.addEventListener('keydown', onKey, true);
        }

        function mapEventKey(e) {
            const code = e.code; // e.g. "KeyA", "Digit3", "F1", "ShiftLeft"
            if (code.startsWith('Key')) return code.slice(3);         // KeyA → A
            if (code.startsWith('Digit')) return code.slice(5);         // Digit3 → 3
            if (code.startsWith('F') && !isNaN(code.slice(1))) return code; // F1..F12
            const map = {
                'Space': 'Space', 'Enter': 'Enter', 'Tab': 'Tab', 'Escape': 'Escape',
                'Pause': 'Pause',
                'Backspace': 'Backspace', 'Delete': 'Delete', 'Insert': 'Insert',
                'Home': 'Home', 'End': 'End', 'PageUp': 'PageUp', 'PageDown': 'PageDown',
                'ArrowUp': 'Up', 'ArrowDown': 'Down', 'ArrowLeft': 'Left', 'ArrowRight': 'Right',
                'ShiftLeft': 'LShift', 'ShiftRight': 'RShift',
                'ControlLeft': 'LCtrl', 'ControlRight': 'RCtrl',
                'AltLeft': 'LAlt', 'AltRight': 'RAlt',
                'Numpad0': 'NumPad0', 'Numpad1': 'NumPad1', 'Numpad2': 'NumPad2',
                'Numpad3': 'NumPad3', 'Numpad4': 'NumPad4', 'Numpad5': 'NumPad5',
                'Numpad6': 'NumPad6', 'Numpad7': 'NumPad7', 'Numpad8': 'NumPad8', 'Numpad9': 'NumPad9',
                'NumpadMultiply': 'Multiply', 'NumpadAdd': 'Add', 'NumpadSubtract': 'Subtract',
                'NumpadDecimal': 'Decimal', 'NumpadDivide': 'Divide',
            };
            return map[code] || null;
        }

        // ── Delay sliders ─────────────────────────────────────────────────────────────
        function syncDelay() {
            const minEl = document.getElementById('f-dmin');
            const maxEl = document.getElementById('f-dmax');
            let mn = parseFloat(minEl.value);
            let mx = parseFloat(maxEl.value);
            if (mn > mx) { mx = mn; maxEl.value = mx; }
            document.getElementById('lbl-dmin').textContent = mn.toFixed(2) + 's';
            document.getElementById('lbl-dmax').textContent = mx.toFixed(2) + 's';
            selected.delayMin = mn;
            selected.delayMax = mx;
        }

        function syncShowOverlay(value) {
            selected.showInOverlay = !!value;
            const box = document.getElementById('overlay-style-fields');
            if (box) box.style.display = value ? 'block' : 'none';
            renderSidebarCards();   // update the small overlay tag live
        }

        // ── Per-entry overlay style (color + icon) ──────────────────────────────
        const OVERLAY_EMOJI = ['⚔️', '🔥', '❄️', '⚡', '🛡️', '💀', '🏹', '🩸'];

        // Sub-block shown under the "Show in overlay" toggle in both the script
        // and preset forms. Colors tint the label + icon; the status dot is
        // unaffected. White (#ffffff) means "no override" → stored as null.
        function overlayStyleFieldsHtml() {
            const shown = selected.showInOverlay ? 'block' : 'none';
            const hex = rgbToHex(selected.overlayColor) || '#ffffff';
            const icon = selected.overlayIcon || '';
            const btn = 'font-size:15px;line-height:1;padding:3px 6px;background:var(--panel,#222);' +
                'border:1px solid var(--border);border-radius:4px;cursor:pointer';
            const chips = OVERLAY_EMOJI.map(e =>
                `<button type="button" style="${btn}" onclick="syncOverlayIcon('${e}')">${e}</button>`).join('');
            return `
        <div id="overlay-style-fields" style="display:${shown};margin-top:10px;padding-left:52px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <label style="font-size:12px;color:var(--muted)">Accent</label>
            <input type="color" id="f-overlay-color" value="${hex}" oninput="syncOverlayColor(this.value)"
              style="width:38px;height:26px;padding:0;border:1px solid var(--border);border-radius:4px;background:none;cursor:pointer" />
            <button type="button" style="${btn};font-size:11px" onclick="resetOverlayColor()">Default</button>
            <label style="font-size:12px;color:var(--muted);margin-left:10px">Icon</label>
            <input type="text" id="f-overlay-icon" maxlength="8" value="${esc(icon)}" placeholder="emoji"
              oninput="syncOverlayIcon(this.value)" style="width:64px;text-align:center" />
          </div>
          <div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">
            ${chips}
            <button type="button" style="${btn}" title="No icon" onclick="syncOverlayIcon('')">✖</button>
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:6px">Tints this row's text + icon in the overlay. The status dot keeps its color.</div>
        </div>`;
        }

        function hexToRgb(hex) {
            const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec((hex || '').trim());
            return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : null;
        }

        function rgbToHex(rgb) {
            if (!Array.isArray(rgb) || rgb.length !== 3) return null;
            return '#' + rgb.map(v => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, '0')).join('');
        }

        function syncOverlayColor(hex) {
            // Treat plain white as "no override" so we don't persist a redundant value.
            selected.overlayColor = (hex && hex.toLowerCase() !== '#ffffff') ? hexToRgb(hex) : null;
            renderSidebarCards();
        }

        function resetOverlayColor() {
            selected.overlayColor = null;
            const el = document.getElementById('f-overlay-color');
            if (el) el.value = '#ffffff';
            renderSidebarCards();
        }

        function syncOverlayIcon(value) {
            selected.overlayIcon = value || null;
            const el = document.getElementById('f-overlay-icon');
            if (el) el.value = value || '';   // keep the text box in sync when set via a palette chip
            renderSidebarCards();
        }

        // ══ Pixel Trigger ═════════════════════════════════════════════════════════════
        function defaultPixelTrigger() {
            return {
                x: 0, y: 0,
                readyColor: [255, 255, 255],
                cooldownColor: [60, 60, 60],
                tolerance: 40,
                reArmDelayMs: 250,
                pollIntervalMs: 75,
                sampleRadius: 1,
                requireReset: false
            };
        }

        function togglePixelTrigger(enabled) {
            if (enabled) {
                selected.pixelTrigger = selected.pixelTrigger || defaultPixelTrigger();
            } else {
                stopPixelLive();
                selected.pixelTrigger = null;
            }
            renderPixelPanel();
            renderSidebarCards();
        }

        function renderPixelPanel() {
            const wrap = document.getElementById('pt-body-wrap');
            if (!wrap) return;
            const pt = selected.pixelTrigger;

            if (!pt) {
                stopPixelLive();
                wrap.innerHTML = `<div class="pt-disabled-note">
          Pixel trigger is <strong>off</strong> — this script loops its steps continuously
          while toggled on (the standard behavior). Enable it to gate the steps on a screen
          color instead, e.g. to recast a cooldown skill the instant its icon lights up again.
        </div>`;
                return;
            }

            wrap.innerHTML = `
        <div class="pt-body">

          <div class="pt-sub">
            <div class="pt-sub-title">Watched Pixel</div>
            <div class="pt-coord-row">
              <div class="form-group">
                <label>Screen X</label>
                <input type="number" id="pt-x" value="${pt.x}" oninput="syncPixelField('x',this.value)" />
              </div>
              <div class="form-group">
                <label>Screen Y</label>
                <input type="number" id="pt-y" value="${pt.y}" oninput="syncPixelField('y',this.value)" />
              </div>
              <button class="btn-sample" id="pt-sample-pos" onclick="samplePixelPosition()">📍 Sample at cursor</button>
            </div>
            <div class="pt-hint">
              Click <strong>Sample at cursor</strong>, then you have 3 seconds to hover your
              mouse over the skill icon in-game — the pixel under the cursor is captured.
            </div>
          </div>

          <div class="pt-sub">
            <div class="pt-sub-title">Reference Colors</div>
            <div class="pt-color-grid">
              <div class="pt-color-box">
                <div class="pt-swatch-row">
                  <div class="pt-swatch" id="pt-ready-swatch"></div>
                  <div class="pt-rgb" id="pt-ready-rgb"></div>
                </div>
                <button class="btn-sample" id="pt-sample-ready" onclick="sampleColor('ready')">Capture ready color</button>
                <div class="pt-hint">Capture while the skill is <strong>OFF</strong> cooldown (icon bright / lit).</div>
              </div>
              <div class="pt-color-box">
                <div class="pt-swatch-row">
                  <div class="pt-swatch" id="pt-cool-swatch"></div>
                  <div class="pt-rgb" id="pt-cool-rgb"></div>
                </div>
                <button class="btn-sample" id="pt-sample-cool" onclick="sampleColor('cooldown')">Capture cooldown color</button>
                <div class="pt-hint">Capture while the skill is <strong>ON</strong> cooldown (icon dark / greyed).</div>
              </div>
            </div>
            <div class="pt-hint" id="pt-color-status" style="margin-top:12px"></div>
          </div>

          <div class="pt-sub">
            <div class="pt-sub-title">Guided In-Game Capture</div>
            <div class="pt-hint" style="margin-bottom:12px">
              Capture the coordinate <em>and</em> both colors <strong>from inside the game</strong>,
              without alt-tabbing. Pick a hotkey, click Start, then in-game hover the skill icon and
              press the hotkey once while it's <strong>ready</strong> and again while it's
              <strong>on cooldown</strong>. If the two colors are too close to tell apart, it suggests
              a nearby pixel that separates them better.
            </div>
            <div class="pt-coord-row" style="align-items:flex-end">
              <div class="form-group">
                <label>Capture hotkey</label>
                <button class="btn-sample" id="pt-cap-key" onclick="pickCaptureKey()">${captureHotkey}</button>
              </div>
              <button class="btn-sample" id="pt-cap-start" onclick="toggleInGameCapture()">${captureArmed ? '■ Cancel capture' : '▶ Start in-game capture'}</button>
            </div>
            <div class="pt-hint" id="pt-cap-status" style="margin-top:12px"></div>
            <div id="pt-cap-nudge" style="margin-top:10px"></div>
          </div>

          <div class="pt-sub">
            <div class="pt-sub-title">Matching &amp; Timing</div>

            <div class="pt-toggle-row" style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)">
              <label class="switch">
                <input type="checkbox" id="pt-require-reset" ${pt.requireReset ? 'checked' : ''}
                  onchange="syncPixelBool('requireReset', this.checked)" />
                <span class="slider"></span>
              </label>
              <div>
                <div style="font-weight:600;font-size:13px;color:var(--text)">
                  One-shot — require reset between fires
                </div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5">
                  Fire <strong>once</strong> when the pixel becomes ready, then wait until it
                  returns to a non-ready state before it can fire again. Use this for actions
                  that should run exactly once per cycle (vs. continuous autocast, which
                  re-fires the moment the pixel is ready again).
                </div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group full">
                <label>Tolerance <span class="val" id="pt-tol-lbl" style="font-family:monospace;color:var(--accent2);float:right">${pt.tolerance}</span></label>
                <input type="range" id="pt-tol" min="0" max="150" step="5" value="${pt.tolerance}"
                  oninput="syncPixelField('tolerance',this.value)" />
                <div class="pt-hint">How far the live pixel may differ from the ready color and still count as ready. Lower = stricter.</div>
              </div>
              <div class="form-group">
                <label>Re-arm Delay (ms)</label>
                <input type="number" id="pt-rearm" min="0" step="25" value="${pt.reArmDelayMs}"
                  oninput="syncPixelField('reArmDelayMs',this.value)" />
                <div class="pt-hint">Pause after firing before it can fire again.</div>
              </div>
              <div class="form-group">
                <label>Poll Interval (ms)</label>
                <input type="number" id="pt-poll" min="15" step="5" value="${pt.pollIntervalMs}"
                  oninput="syncPixelField('pollIntervalMs',this.value)" />
                <div class="pt-hint">How often the pixel is checked while waiting.</div>
              </div>
              <div class="form-group full">
                <label>Sample Area</label>
                <select id="pt-radius" onchange="syncPixelField('sampleRadius',this.value)">
                  <option value="0">Single pixel</option>
                  <option value="1">3 × 3 average</option>
                  <option value="2">5 × 5 average</option>
                  <option value="3">7 × 7 average</option>
                </select>
                <div class="pt-hint">Averaging a small area steadies the reading against icon-edge highlights and animation flicker.</div>
              </div>
            </div>
          </div>

          <div class="pt-sub">
            <div class="pt-sub-title">Live Test</div>
            <div class="pt-live-readout">
              <button class="btn-sample" id="pt-live-btn" onclick="togglePixelLive()">▶ Start live readout</button>
              <div class="pt-swatch" id="pt-live-swatch" style="width:32px;height:32px"></div>
              <div class="pt-rgb" id="pt-live-rgb"><span class="muted">— not running —</span></div>
              <div style="flex:1"></div>
              <div class="pt-verdict offline" id="pt-verdict">IDLE</div>
            </div>
            <div class="pt-hint">
              Polls the watched pixel live and shows whether the engine would fire right now —
              tune tolerance until READY / WAITING track the skill's real state.
            </div>
          </div>

        </div>`;

            // Populate the dynamic bits that can't be inlined above
            document.getElementById('pt-radius').value = String(pt.sampleRadius);
            updatePixelSwatches();
            updateColorStatus();
            renderCaptureStatus();
        }

        function syncPixelField(field, value) {
            const pt = selected.pixelTrigger;
            if (!pt) return;
            const n = parseInt(value, 10);
            pt[field] = isNaN(n) ? 0 : n;
            if (field === 'tolerance') {
                const lbl = document.getElementById('pt-tol-lbl');
                if (lbl) lbl.textContent = pt.tolerance;
            }
        }

        function syncPixelBool(field, value) {
            const pt = selected.pixelTrigger;
            if (!pt) return;
            pt[field] = !!value;
        }

        function updatePixelSwatches() {
            const pt = selected.pixelTrigger;
            if (!pt) return;
            const rc = pt.readyColor, cc = pt.cooldownColor;
            const set = (swId, rgbId, c) => {
                const sw = document.getElementById(swId);
                const rgb = document.getElementById(rgbId);
                if (sw) sw.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
                if (rgb) rgb.innerHTML = `R ${c[0]}<br>G ${c[1]}<br>B ${c[2]}`;
            };
            set('pt-ready-swatch', 'pt-ready-rgb', rc);
            set('pt-cool-swatch', 'pt-cool-rgb', cc);
        }

        function updateColorStatus() {
            const el = document.getElementById('pt-color-status');
            if (!el) return;
            const pt = selected.pixelTrigger;
            const d = colorDistance(pt.readyColor, pt.cooldownColor);
            if (d < 25) {
                el.innerHTML = `⚠ Ready and cooldown colors are nearly identical (separation ${d.toFixed(0)}). ` +
                    `The trigger will be unreliable — pick a pixel where the icon changes more dramatically between states.`;
                el.style.color = 'var(--red)';
            } else {
                el.innerHTML = `Color separation: <strong>${d.toFixed(0)}</strong>. ` +
                    `Any tolerance below this cleanly distinguishes the two states — try around ${Math.round(d / 2)}.`;
                el.style.color = 'var(--muted)';
            }
        }

        function colorDistance(a, b) {
            const dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
            return Math.sqrt(dr * dr + dg * dg + db * db);
        }

        // ── Sampling (countdown → capture) ────────────────────────────────────────────
        function countdownButton(btn, baseLabel, secs, action) {
            if (!btn || sampleBusy) return;
            sampleBusy = true;
            setSampleButtonsDisabled(true);
            btn.disabled = false;
            btn.classList.add('counting');
            let remaining = secs;
            btn.textContent = `Capturing in ${remaining}…`;
            const iv = setInterval(async () => {
                remaining--;
                if (remaining > 0) {
                    btn.textContent = `Capturing in ${remaining}…`;
                    return;
                }
                clearInterval(iv);
                btn.textContent = 'Capturing…';
                try { await action(); }
                finally {
                    btn.classList.remove('counting');
                    btn.textContent = baseLabel;
                    sampleBusy = false;
                    setSampleButtonsDisabled(false);
                }
            }, 1000);
        }

        function setSampleButtonsDisabled(disabled) {
            ['pt-sample-pos', 'pt-sample-ready', 'pt-sample-cool'].forEach(id => {
                const b = document.getElementById(id);
                if (b && !b.classList.contains('counting')) b.disabled = disabled;
            });
        }

        function samplePixelPosition() {
            const btn = document.getElementById('pt-sample-pos');
