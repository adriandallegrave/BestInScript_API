<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestInScript</title>
    <style>
        /* ── Reset & Base ─────────────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg0: #09090e;
            --bg1: #111118;
            --bg2: #1a1a25;
            --bg3: #22222f;
            --border: #2e2e40;
            --accent: #e8882a;
            --accent2: #ffaa55;
            --green: #3ecf6e;
            --red: #e85252;
            --text: #d4cfc8;
            --muted: #7a7590;
            --radius: 8px;
            --font: 'Segoe UI', system-ui, sans-serif;
        }

        html, body {
            height: 100%;
            background: var(--bg0);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
        }

        button {
            cursor: pointer;
            font-family: var(--font);
            font-size: 13px;
            border: none;
            border-radius: var(--radius);
            transition: filter .15s, background .15s;
        }

            button:hover {
                filter: brightness(1.15);
            }

            button:active {
                filter: brightness(0.9);
            }

        input, select {
            font-family: var(--font);
            font-size: 13px;
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 10px;
            outline: none;
            transition: border-color .15s;
        }

            input:focus, select:focus {
                border-color: var(--accent);
            }

        label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
        }

        /* ── Layout ───────────────────────────────────────────────────────── */
        #app {
            display: grid;
            grid-template-rows: 56px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        #header {
            background: var(--bg1);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
        }

            #header h1 {
                font-size: 18px;
                font-weight: 700;
                letter-spacing: .06em;
                color: var(--accent);
                text-transform: uppercase;
            }

            #header .tagline {
                color: var(--muted);
                font-size: 12px;
            }

            #header .spacer {
                flex: 1;
            }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            flex-shrink: 0;
        }

            #status-dot.error {
                background: var(--red);
                box-shadow: 0 0 6px var(--red);
            }

        #status-label {
            font-size: 12px;
            color: var(--muted);
        }

        #btn-stop-all {
            background: var(--bg3);
            color: var(--red);
            padding: 6px 14px;
            border: 1px solid var(--border);
        }

        #main {
            display: grid;
            grid-template-columns: 300px 1fr;
            overflow: hidden;
        }

        /* ── Sidebar ──────────────────────────────────────────────────────── */
        #sidebar {
            background: var(--bg1);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #sidebar-head {
            padding: 16px 16px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            #sidebar-head span {
                flex: 1;
                font-weight: 700;
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: .05em;
                color: var(--muted);
            }

        #btn-new {
            background: var(--accent);
            color: #000;
            padding: 7px 14px;
            font-weight: 700;
        }

        #script-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 8px;
        }

            #script-list::-webkit-scrollbar {
                width: 4px;
            }

            #script-list::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 4px;
            }

        .script-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 11px 13px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: border-color .15s, background .15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .script-card:hover {
                border-color: var(--accent);
                background: var(--bg3);
            }

            .script-card.selected {
                border-color: var(--accent);
                background: var(--bg3);
            }

            .script-card .key-badge {
                background: var(--bg0);
                border: 1px solid var(--border);
                border-radius: 5px;
                padding: 3px 8px;
                font-size: 12px;
                font-weight: 700;
                color: var(--accent2);
                min-width: 34px;
                text-align: center;
                font-family: monospace;
                flex-shrink: 0;
            }

            .script-card .info {
                flex: 1;
                min-width: 0;
            }

            .script-card .name {
                font-weight: 600;
                font-size: 13px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .script-card .meta {
                font-size: 11px;
                color: var(--muted);
                margin-top: 2px;
            }

            .script-card .running-pill {
                background: #1d3d28;
                color: var(--green);
                border: 1px solid #2e6645;
                border-radius: 20px;
                font-size: 10px;
                padding: 2px 8px;
                font-weight: 700;
                letter-spacing: .04em;
                flex-shrink: 0;
            }

        .empty-state {
            color: var(--muted);
            text-align: center;
            padding: 32px 16px;
            font-size: 13px;
            line-height: 1.6;
        }

        /* ── Editor ───────────────────────────────────────────────────────── */
        #editor {
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

            #editor::-webkit-scrollbar {
                width: 5px;
            }

            #editor::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 4px;
            }

        .panel {
            background: var(--bg1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

            .form-group.full {
                grid-column: 1 / -1;
            }

            .form-group input, .form-group select {
                width: 100%;
            }

        /* Key capture */
        #trigger-capture {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #trigger-display {
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 14px;
            font-family: monospace;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent2);
            min-width: 70px;
            text-align: center;
            letter-spacing: .05em;
        }

        #btn-capture {
            background: var(--bg3);
            color: var(--text);
            padding: 7px 14px;
            border: 1px solid var(--border);
        }

            #btn-capture.listening {
                background: var(--accent);
                color: #000;
                border-color: var(--accent);
            }

        /* Delay sliders */
        .delay-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            align-items: end;
        }

        .delay-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .delay-group .val {
                font-family: monospace;
                font-size: 13px;
                color: var(--accent2);
                text-align: right;
            }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--bg3);
            border-radius: 2px;
            outline: none;
            border: none;
            padding: 0;
        }

            input[type=range]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                background: var(--accent);
                border-radius: 50%;
                cursor: pointer;
                box-shadow: 0 0 4px rgba(232,136,42,.5);
            }

        /* Steps builder */
        #steps-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .step-number {
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 2px 9px;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            font-family: monospace;
        }

        .step-header span {
            flex: 1;
        }

        .btn-remove-step {
            background: var(--bg3);
            color: var(--red);
            padding: 4px 10px;
            font-size: 12px;
            border: 1px solid var(--border);
        }

        .step-section {
            margin-bottom: 10px;
        }

            .step-section label {
                font-size: 11px;
                color: var(--muted);
                margin-bottom: 6px;
            }

        .key-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
        }

        .key-chip {
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 3px 8px;
            font-family: monospace;
            font-size: 12px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 5px;
        }

            .key-chip button {
                background: none;
                color: var(--muted);
                font-size: 14px;
                padding: 0;
                line-height: 1;
                border-radius: 0;
            }

                .key-chip button:hover {
                    color: var(--red);
                }

        .add-key-row {
            display: flex;
            gap: 6px;
        }

            .add-key-row input {
                flex: 1;
            }

        .btn-add-key {
            background: var(--bg3);
            color: var(--text);
            padding: 6px 12px;
            border: 1px solid var(--border);
        }

        #btn-add-step {
            background: var(--bg3);
            color: var(--text);
            padding: 8px 16px;
            border: 1px dashed var(--border);
            width: 100%;
            margin-top: 4px;
        }

            #btn-add-step:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

        /* Action bar */
        .action-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

            .action-bar .spacer {
                flex: 1;
            }

        #btn-save {
            background: var(--accent);
            color: #000;
            font-weight: 700;
            padding: 9px 22px;
        }

        #btn-delete {
            background: var(--bg3);
            color: var(--red);
            padding: 9px 18px;
            border: 1px solid var(--border);
        }

        .no-script {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            gap: 12px;
        }

            .no-script .icon {
                font-size: 48px;
                opacity: .3;
            }

            .no-script p {
                font-size: 14px;
            }

        /* Toast */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            pointer-events: none;
        }

        .toast {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            font-size: 13px;
            max-width: 320px;
            animation: slideIn .2s ease;
        }

            .toast.success {
                border-left: 3px solid var(--green);
            }

            .toast.error {
                border-left: 3px solid var(--red);
            }

        @keyframes slideIn {
            from {
                transform: translateX(20px);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        /* Key autocomplete dropdown */
        .key-input-wrap {
            position: relative;
        }

        .ac-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg2);
            border: 1px solid var(--accent);
            border-radius: 6px;
            z-index: 50;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 2px;
        }

            .ac-list div {
                padding: 6px 10px;
                font-family: monospace;
                font-size: 12px;
                cursor: pointer;
            }

                .ac-list div:hover, .ac-list div.active {
                    background: var(--bg3);
                    color: var(--accent2);
                }
    </style>
</head>
<body>
    <div id="app">

        <!-- Header -->
        <header id="header">
            <h1>⚔ BestInScript</h1>
            <span class="tagline">ARPG Macro Engine</span>
            <div class="spacer"></div>
            <div id="status-dot"></div>
            <span id="status-label">Checking…</span>
            <button id="btn-stop-all">■ Stop All</button>
        </header>

        <!-- Body -->
        <div id="main">

            <!-- Sidebar -->
            <aside id="sidebar">
                <div id="sidebar-head">
                    <span>Scripts</span>
                    <button id="btn-new">+ New</button>
                </div>
                <div id="script-list"></div>
            </aside>

            <!-- Editor -->
            <main id="editor">
                <div class="no-script" id="no-script">
                    <div class="icon">🎮</div>
                    <p>Select a script or click <strong>+ New</strong> to create one.</p>
                </div>
                <!-- editor content injected by JS -->
            </main>

        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // ── Constants ────────────────────────────────────────────────────────────────
        const API = `${window.location.origin}/api`;

        const ALL_KEYS = [
            ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
            ...Array.from({ length: 10 }, (_, i) => String(i)),
            ...Array.from({ length: 12 }, (_, i) => `F${i + 1}`),
            ...Array.from({ length: 10 }, (_, i) => `NumPad${i}`),
            'Space', 'Enter', 'Tab', 'Escape', 'Backspace', 'Delete', 'Insert',
            'Home', 'End', 'PageUp', 'PageDown', 'Up', 'Down', 'Left', 'Right',
            'Shift', 'LShift', 'RShift', 'Ctrl', 'LCtrl', 'RCtrl', 'Alt', 'LAlt', 'RAlt',
            'Multiply', 'Add', 'Subtract', 'Decimal', 'Divide',
            'Mouse1', 'Mouse2', 'Mouse3', 'Mouse4', 'Mouse5'
        ];

        const TRIGGER_KEYS = ALL_KEYS.filter(k => !k.startsWith('Mouse'));

        // ── State ────────────────────────────────────────────────────────────────────
        let scripts = [];
        let statuses = {};
        let selected = null;   // ScriptConfig being edited (null = none)
        let isNew = false;
        let capturing = false;

        // ── Bootstrap ────────────────────────────────────────────────────────────────
        (async () => {
            await loadScripts();
            renderSidebar();
            showNoScript();
            pollStatus();
        })();

        // ── Data ─────────────────────────────────────────────────────────────────────
        async function loadScripts() {
            try {
                const r = await fetch(`${API}/scripts`);
                scripts = await r.json();
            } catch { scripts = []; }
        }

        async function pollStatus() {
            try {
                const r = await fetch(`${API}/engine/status`);
                const list = await r.json();
                statuses = {};
                list.forEach(s => statuses[s.id] = s.isRunning);
                document.getElementById('status-dot').classList.remove('error');
                document.getElementById('status-label').textContent = 'Engine running';
                renderSidebarCards();
            } catch {
                document.getElementById('status-dot').classList.add('error');
                document.getElementById('status-label').textContent = 'API offline';
            }
            setTimeout(pollStatus, 2000);
        }

        // ── Sidebar ───────────────────────────────────────────────────────────────────
        function renderSidebar() {
            renderSidebarCards();
        }

        function renderSidebarCards() {
            const el = document.getElementById('script-list');
            if (!scripts.length) {
                el.innerHTML = '<div class="empty-state">No scripts yet.<br>Click <strong>+ New</strong> to get started.</div>';
                return;
            }
            el.innerHTML = scripts.map(s => {
                const running = !!statuses[s.id];
                const sel = selected && selected.id === s.id ? 'selected' : '';
                return `
          <div class="script-card ${sel}" data-id="${s.id}" onclick="selectScript('${s.id}')">
            <div class="key-badge">${esc(s.triggerKey)}</div>
            <div class="info">
              <div class="name">${esc(s.name)}</div>
              <div class="meta">${s.steps.length} step${s.steps.length !== 1 ? 's' : ''} · ${s.delayMin}–${s.delayMax}s</div>
            </div>
            ${running ? '<div class="running-pill">● ON</div>' : ''}
          </div>`;
            }).join('');
        }

        // ── Selection ─────────────────────────────────────────────────────────────────
        function selectScript(id) {
            const s = scripts.find(x => x.id === id);
            if (!s) return;
            isNew = false;
            selected = JSON.parse(JSON.stringify(s)); // deep copy
            renderEditor();
        }

        function newScript() {
            isNew = true;
            selected = {
                id: null, name: 'New Script', triggerKey: '3',
                steps: [{ hold: [], press: [] }], delayMin: 0.4, delayMax: 0.6
            };
            renderEditor();
        }

        function showNoScript() {
            selected = null;
            document.getElementById('no-script').style.display = 'flex';
            // remove any injected panels
            document.querySelectorAll('#editor .panel, #editor .action-bar').forEach(el => el.remove());
        }

        // ── Editor render ─────────────────────────────────────────────────────────────
        function renderEditor() {
            const noScript = document.getElementById('no-script');
            noScript.style.display = 'none';

            // Clear old panels
            document.querySelectorAll('#editor .panel, #editor .action-bar').forEach(el => el.remove());

            const editor = document.getElementById('editor');

            // ── Basic settings panel ──
            const basic = mkPanel('Basic Settings', `
        <div class="form-row">
          <div class="form-group full">
            <label>Script Name</label>
            <input id="f-name" type="text" value="${esc(selected.name)}" placeholder="e.g. Hammerwing Rotation" />
          </div>

          <div class="form-group">
            <label>Trigger Key <span style="color:var(--muted);font-weight:400;text-transform:none">(keyboard only)</span></label>
            <div id="trigger-capture">
              <div id="trigger-display">${esc(selected.triggerKey)}</div>
              <button id="btn-capture" onclick="startCapture()">Click to Capture</button>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:5px">Press this key in-game to toggle the script on/off.</div>
          </div>

          <div class="form-group">
            <label>Delay Between Steps</label>
            <div class="delay-row">
              <div class="delay-group">
                <label style="margin-bottom:2px">Min <span class="val" id="lbl-dmin">${selected.delayMin}s</span></label>
                <input id="f-dmin" type="range" min="0.1" max="5" step="0.05"
                  value="${selected.delayMin}" oninput="syncDelay()" />
              </div>
              <div class="delay-group">
                <label style="margin-bottom:2px">Max <span class="val" id="lbl-dmax">${selected.delayMax}s</span></label>
                <input id="f-dmax" type="range" min="0.1" max="5" step="0.05"
                  value="${selected.delayMax}" oninput="syncDelay()" />
              </div>
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:5px">Each step waits a random time in this window. Randomness avoids detection.</div>
          </div>
        </div>
      `);
            editor.appendChild(basic);

            // ── Steps panel ──
            const stepsPanel = mkPanel('Script Steps', `
        <div style="font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6">
          Each step: hold keys are pressed down → press keys are tapped → hold keys are released → random delay.
          Steps loop indefinitely while the script is active.
        </div>
        <div id="steps-list"></div>
        <button id="btn-add-step" onclick="addStep()">+ Add Step</button>
      `);
            editor.appendChild(stepsPanel);

            renderSteps();

            // ── Action bar ──
            const bar = document.createElement('div');
            bar.className = 'action-bar';
            bar.innerHTML = `
        <button id="btn-delete" onclick="deleteScript()" ${isNew ? 'style="display:none"' : ''}>🗑 Delete</button>
        <div class="spacer"></div>
        <button id="btn-save" onclick="saveScript()">💾 Save Script</button>
      `;
            editor.appendChild(bar);

            // Highlight selected card
            renderSidebarCards();
        }

        function mkPanel(title, html) {
            const d = document.createElement('div');
            d.className = 'panel';
            d.innerHTML = `<div class="panel-title">${title}</div>${html}`;
            return d;
        }

        // ── Steps rendering ────────────────────────────────────────────────────────────
        function renderSteps() {
            const list = document.getElementById('steps-list');
            if (!list) return;
            list.innerHTML = '';
            selected.steps.forEach((step, i) => {
                const card = document.createElement('div');
                card.className = 'step-card';
                card.dataset.idx = i;
                card.innerHTML = `
          <div class="step-header">
            <span class="step-number">STEP ${i + 1}</span>
            <span></span>
            <button class="btn-remove-step" onclick="removeStep(${i})">✕ Remove</button>
          </div>
          <div class="step-section">
            <label>Hold Keys <span style="font-weight:400;text-transform:none;color:var(--muted)">(held down for entire step)</span></label>
            <div class="key-chips" id="hold-chips-${i}"></div>
            <div class="add-key-row">
              <div class="key-input-wrap" style="flex:1">
                <input id="hold-input-${i}" type="text" placeholder="e.g. Shift, Ctrl" autocomplete="off"
                  oninput="showAC(this,'hold',${i})" onkeydown="keyInputDown(event,'hold',${i})" />
                <div class="ac-list" id="hold-ac-${i}" style="display:none"></div>
              </div>
              <button class="btn-add-key" onclick="addKey('hold',${i})">+ Add</button>
            </div>
          </div>
          <div class="step-section" style="margin-bottom:0">
            <label>Press Keys <span style="font-weight:400;text-transform:none;color:var(--muted)">(tap once per step)</span></label>
            <div class="key-chips" id="press-chips-${i}"></div>
            <div class="add-key-row">
              <div class="key-input-wrap" style="flex:1">
                <input id="press-input-${i}" type="text" placeholder="e.g. Mouse1, Q, E" autocomplete="off"
                  oninput="showAC(this,'press',${i})" onkeydown="keyInputDown(event,'press',${i})" />
                <div class="ac-list" id="press-ac-${i}" style="display:none"></div>
              </div>
              <button class="btn-add-key" onclick="addKey('press',${i})">+ Add</button>
            </div>
          </div>
        `;
                list.appendChild(card);
                renderChips('hold', i);
                renderChips('press', i);
            });
        }

        function renderChips(type, idx) {
            const step = selected.steps[idx];
            const arr = type === 'hold' ? step.hold : step.press;
            const el = document.getElementById(`${type}-chips-${idx}`);
            if (!el) return;
            el.innerHTML = arr.map((k, ki) => `
        <div class="key-chip">
          <span>${esc(k)}</span>
          <button onclick="removeKey('${type}',${idx},${ki})">×</button>
        </div>`).join('');
        }

        function addStep() {
            selected.steps.push({ hold: [], press: [] });
            renderSteps();
        }

        function removeStep(idx) {
            selected.steps.splice(idx, 1);
            renderSteps();
        }

        function addKey(type, idx) {
            const input = document.getElementById(`${type}-input-${idx}`);
            const val = input.value.trim();
            if (!val) return;
            const normalized = val.toUpperCase() === val ? val : val.charAt(0).toUpperCase() + val.slice(1);
            const match = ALL_KEYS.find(k => k.toUpperCase() === normalized.toUpperCase());
            if (!match) { toast(`Unknown key: ${val}`, 'error'); return; }
            const arr = type === 'hold' ? selected.steps[idx].hold : selected.steps[idx].press;
            if (!arr.includes(match)) arr.push(match);
            input.value = '';
            closeAC(type, idx);
            renderChips(type, idx);
        }

        function removeKey(type, idx, ki) {
            const arr = type === 'hold' ? selected.steps[idx].hold : selected.steps[idx].press;
            arr.splice(ki, 1);
            renderChips(type, idx);
        }

        function keyInputDown(e, type, idx) {
            const acId = `${type}-ac-${idx}`;
            const ac = document.getElementById(acId);
            if (e.key === 'Enter') { addKey(type, idx); return; }
            if (e.key === 'Escape') { closeAC(type, idx); return; }
            if (ac && ac.style.display !== 'none') {
                const items = ac.querySelectorAll('div');
                const cur = ac.querySelector('div.active');
                let idx2 = [...items].indexOf(cur);
                if (e.key === 'ArrowDown') { e.preventDefault(); idx2 = Math.min(idx2 + 1, items.length - 1); }
                if (e.key === 'ArrowUp') { e.preventDefault(); idx2 = Math.max(idx2 - 1, 0); }
                items.forEach((it, i) => it.classList.toggle('active', i === idx2));
                if (cur) cur.scrollIntoView({ block: 'nearest' });
            }
        }

        // ── Autocomplete ──────────────────────────────────────────────────────────────
        function showAC(input, type, idx) {
            const q = input.value.trim().toUpperCase();
            const acEl = document.getElementById(`${type}-ac-${idx}`);
            if (!q) { acEl.style.display = 'none'; return; }
            const matches = ALL_KEYS.filter(k => k.toUpperCase().startsWith(q)).slice(0, 10);
            if (!matches.length) { acEl.style.display = 'none'; return; }
            acEl.innerHTML = matches.map(k =>
                `<div onclick="pickAC('${k}','${type}',${idx})">${k}</div>`).join('');
            acEl.style.display = 'block';
        }

        function pickAC(key, type, idx) {
            document.getElementById(`${type}-input-${idx}`).value = key;
            closeAC(type, idx);
            addKey(type, idx);
        }

        function closeAC(type, idx) {
            const el = document.getElementById(`${type}-ac-${idx}`);
            if (el) el.style.display = 'none';
        }

        // ── Trigger key capture ────────────────────────────────────────────────────────
        function startCapture() {
            if (capturing) return;
            capturing = true;
            const btn = document.getElementById('btn-capture');
            const dis = document.getElementById('trigger-display');
            btn.classList.add('listening');
            btn.textContent = '⌨ Press any key…';
            dis.textContent = '…';

            function onKey(e) {
                e.preventDefault();
                e.stopPropagation();
                // Map key event to our key name
                const name = mapEventKey(e);
                if (!name || !TRIGGER_KEYS.includes(name)) {
                    toast('Invalid trigger key (mouse buttons not allowed here)', 'error');
                    reset();
                    return;
                }
                selected.triggerKey = name;
                dis.textContent = name;
                reset();
            }

            function reset() {
                capturing = false;
                btn.classList.remove('listening');
                btn.textContent = 'Click to Capture';
                document.removeEventListener('keydown', onKey, true);
            }

            document.addEventListener('keydown', onKey, true);
        }

        function mapEventKey(e) {
            const code = e.code; // e.g. "KeyA", "Digit3", "F1", "ShiftLeft"
            if (code.startsWith('Key')) return code.slice(3);         // KeyA → A
            if (code.startsWith('Digit')) return code.slice(5);         // Digit3 → 3
            if (code.startsWith('F') && !isNaN(code.slice(1))) return code; // F1..F12
            const map = {
                'Space': 'Space', 'Enter': 'Enter', 'Tab': 'Tab', 'Escape': 'Escape',
                'Backspace': 'Backspace', 'Delete': 'Delete', 'Insert': 'Insert',
                'Home': 'Home', 'End': 'End', 'PageUp': 'PageUp', 'PageDown': 'PageDown',
                'ArrowUp': 'Up', 'ArrowDown': 'Down', 'ArrowLeft': 'Left', 'ArrowRight': 'Right',
                'ShiftLeft': 'LShift', 'ShiftRight': 'RShift',
                'ControlLeft': 'LCtrl', 'ControlRight': 'RCtrl',
                'AltLeft': 'LAlt', 'AltRight': 'RAlt',
                'Numpad0': 'NumPad0', 'Numpad1': 'NumPad1', 'Numpad2': 'NumPad2',
                'Numpad3': 'NumPad3', 'Numpad4': 'NumPad4', 'Numpad5': 'NumPad5',
                'Numpad6': 'NumPad6', 'Numpad7': 'NumPad7', 'Numpad8': 'NumPad8', 'Numpad9': 'NumPad9',
                'NumpadMultiply': 'Multiply', 'NumpadAdd': 'Add', 'NumpadSubtract': 'Subtract',
                'NumpadDecimal': 'Decimal', 'NumpadDivide': 'Divide',
            };
            return map[code] || null;
        }

        // ── Delay sliders ─────────────────────────────────────────────────────────────
        function syncDelay() {
            const minEl = document.getElementById('f-dmin');
            const maxEl = document.getElementById('f-dmax');
            let mn = parseFloat(minEl.value);
            let mx = parseFloat(maxEl.value);
            if (mn > mx) { mx = mn; maxEl.value = mx; }
            document.getElementById('lbl-dmin').textContent = mn.toFixed(2) + 's';
            document.getElementById('lbl-dmax').textContent = mx.toFixed(2) + 's';
            selected.delayMin = mn;
            selected.delayMax = mx;
        }

        // ── Save / Delete ──────────────────────────────────────────────────────────────
        async function saveScript() {
            selected.name = document.getElementById('f-name').value.trim();
            syncDelay();

            if (!selected.name) { toast('Script name is required.', 'error'); return; }

            const payload = {
                id: selected.id || '00000000-0000-0000-0000-000000000000',
                name: selected.name,
                triggerKey: selected.triggerKey,
                steps: selected.steps,
                delayMin: selected.delayMin,
                delayMax: selected.delayMax
            };

            try {
                let r;
                if (isNew) {
                    r = await fetch(`${API}/scripts`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    r = await fetch(`${API}/scripts/${selected.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                if (!r.ok) {
                    const txt = await r.text();
                    toast('Save failed: ' + txt, 'error');
                    return;
                }
                const saved = await r.json();
                selected = saved;
                isNew = false;
                await loadScripts();
                renderSidebar();
                renderEditor();
                toast(`"${saved.name}" saved ✓`, 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        async function deleteScript() {
            if (!selected || isNew) return;
            if (!confirm(`Delete "${selected.name}"? This cannot be undone.`)) return;
            try {
                const r = await fetch(`${API}/scripts/${selected.id}`, { method: 'DELETE' });
                if (!r.ok) { toast('Delete failed', 'error'); return; }
                await loadScripts();
                showNoScript();
                renderSidebar();
                toast('Script deleted.', 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        // ── Stop all ──────────────────────────────────────────────────────────────────
        document.getElementById('btn-stop-all').addEventListener('click', async () => {
            try {
                await fetch(`${API}/engine/stop-all`, { method: 'POST' });
                toast('All scripts stopped.', 'success');
            } catch { toast('Could not reach API.', 'error'); }
        });

        // ── New script ────────────────────────────────────────────────────────────────
        document.getElementById('btn-new').addEventListener('click', newScript);

        // ── Toast ─────────────────────────────────────────────────────────────────────
        function toast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3200);
        }

        // ── Utils ─────────────────────────────────────────────────────────────────────
        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Close autocomplete on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('.key-input-wrap'))
                document.querySelectorAll('.ac-list').forEach(el => el.style.display = 'none');
        });
    </script>
</body>
</html>
