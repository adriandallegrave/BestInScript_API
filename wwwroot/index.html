<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BestInScript</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
        /* ── Reset & Base ─────────────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg0: #09090e;
            --bg1: #111118;
            --bg2: #1a1a25;
            --bg3: #22222f;
            --border: #2e2e40;
            --accent: #e8882a;
            --accent2: #ffaa55;
            --green: #3ecf6e;
            --red: #e85252;
            --text: #d4cfc8;
            --muted: #7a7590;
            --radius: 8px;
            --font: 'Segoe UI', system-ui, sans-serif;
        }

        html, body {
            height: 100%;
            background: var(--bg0);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
        }

        button {
            cursor: pointer;
            font-family: var(--font);
            font-size: 13px;
            border: none;
            border-radius: var(--radius);
            transition: filter .15s, background .15s;
        }

            button:hover {
                filter: brightness(1.15);
            }

            button:active {
                filter: brightness(0.9);
            }

        input, select {
            font-family: var(--font);
            font-size: 13px;
            background: var(--bg3);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 10px;
            outline: none;
            transition: border-color .15s;
        }

            input:focus, select:focus {
                border-color: var(--accent);
            }

        label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 600;
            letter-spacing: .04em;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border);
        }

        /* ── Layout ───────────────────────────────────────────────────────── */
        #app {
            display: grid;
            grid-template-rows: 56px 1fr;
            height: 100vh;
            overflow: hidden;
        }

        #header {
            background: var(--bg1);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 24px;
        }

            #header h1 {
                font-size: 18px;
                font-weight: 700;
                letter-spacing: .06em;
                color: var(--accent);
                text-transform: uppercase;
            }

            #header .tagline {
                color: var(--muted);
                font-size: 12px;
            }

            #header .spacer {
                flex: 1;
            }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
            flex-shrink: 0;
        }

            #status-dot.error {
                background: var(--red);
                box-shadow: 0 0 6px var(--red);
            }

        #status-label {
            font-size: 12px;
            color: var(--muted);
        }

        #btn-stop-all {
            background: var(--bg3);
            color: var(--red);
            padding: 6px 14px;
            border: 1px solid var(--border);
        }

        #main {
            display: grid;
            grid-template-columns: 300px 1fr;
            overflow: hidden;
        }

        /* ── Sidebar ──────────────────────────────────────────────────────── */
        #sidebar {
            background: var(--bg1);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 120px;
            overflow: hidden;
        }

            .sidebar-section + .sidebar-section {
                border-top: 1px solid var(--border);
            }

        .sidebar-head {
            padding: 14px 16px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .sidebar-head span {
                flex: 1;
                font-weight: 700;
                font-size: 13px;
                text-transform: uppercase;
                letter-spacing: .05em;
                color: var(--muted);
            }

        #btn-new, #btn-new-preset {
            background: var(--accent);
            color: #000;
            padding: 7px 14px;
            font-weight: 700;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px 8px;
        }

            .sidebar-list::-webkit-scrollbar {
                width: 4px;
            }

            .sidebar-list::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 4px;
            }

        /* Preset card mirrors script card but tinted */
        .preset-card .key-badge {
            color: var(--green) !important;
        }

        .preset-card .meta-members {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* Member checklist on the preset editor */
        .member-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 360px;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            background: var(--bg0);
        }

        .member-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 9px;
            border-radius: 5px;
            background: var(--bg2);
            border: 1px solid transparent;
            cursor: pointer;
            transition: border-color .12s, background .12s;
        }

            .member-row:hover {
                border-color: var(--accent);
            }

            .member-row.checked {
                border-color: var(--accent);
                background: var(--bg3);
            }

            .member-row input[type=checkbox] {
                width: 16px;
                height: 16px;
                accent-color: var(--accent);
                margin: 0;
                cursor: pointer;
            }

            .member-row .name {
                flex: 1;
                font-weight: 600;
                font-size: 13px;
            }

            .member-row .key {
                font-family: monospace;
                font-size: 11px;
                color: var(--accent2);
                background: var(--bg0);
                padding: 2px 8px;
                border-radius: 4px;
                border: 1px solid var(--border);
            }

        .script-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 11px 13px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: border-color .15s, background .15s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .script-card:hover {
                border-color: var(--accent);
                background: var(--bg3);
            }

            .script-card.selected {
                border-color: var(--accent);
                background: var(--bg3);
            }

            .script-card .key-badge {
                background: var(--bg0);
                border: 1px solid var(--border);
                border-radius: 5px;
                padding: 3px 8px;
                font-size: 12px;
                font-weight: 700;
                color: var(--accent2);
                min-width: 34px;
                text-align: center;
                font-family: monospace;
                flex-shrink: 0;
            }

            .script-card .info {
                flex: 1;
                min-width: 0;
            }

            .script-card .name {
                font-weight: 600;
                font-size: 13px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .script-card .meta {
                font-size: 11px;
                color: var(--muted);
                margin-top: 2px;
            }

            .script-card .running-pill {
                background: #1d3d28;
                color: var(--green);
                border: 1px solid #2e6645;
                border-radius: 20px;
                font-size: 10px;
                padding: 2px 8px;
                font-weight: 700;
                letter-spacing: .04em;
                flex-shrink: 0;
            }

        .empty-state {
            color: var(--muted);
            text-align: center;
            padding: 32px 16px;
            font-size: 13px;
            line-height: 1.6;
        }

        /* ── Editor ───────────────────────────────────────────────────────── */
        #editor {
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

            #editor::-webkit-scrollbar {
                width: 5px;
            }

            #editor::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 4px;
            }

        .panel {
            background: var(--bg1);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            margin-bottom: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

            .form-group.full {
                grid-column: 1 / -1;
            }

            .form-group input, .form-group select {
                width: 100%;
            }

        /* Key capture */
        #trigger-capture {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #trigger-display {
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 14px;
            font-family: monospace;
            font-size: 15px;
            font-weight: 700;
            color: var(--accent2);
            min-width: 70px;
            text-align: center;
            letter-spacing: .05em;
        }

        #btn-capture {
            background: var(--bg3);
            color: var(--text);
            padding: 7px 14px;
            border: 1px solid var(--border);
        }

            #btn-capture.listening {
                background: var(--accent);
                color: #000;
                border-color: var(--accent);
            }

        /* Delay sliders */
        .delay-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            align-items: end;
        }

        .delay-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .delay-group .val {
                font-family: monospace;
                font-size: 13px;
                color: var(--accent2);
                text-align: right;
            }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--bg3);
            border-radius: 2px;
            outline: none;
            border: none;
            padding: 0;
        }

            input[type=range]::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 16px;
                height: 16px;
                background: var(--accent);
                border-radius: 50%;
                cursor: pointer;
                box-shadow: 0 0 4px rgba(232,136,42,.5);
            }

        /* Steps builder */
        #steps-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .step-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .step-number {
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 2px 9px;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            font-family: monospace;
        }

        .step-header span {
            flex: 1;
        }

        .btn-remove-step {
            background: var(--bg3);
            color: var(--red);
            padding: 4px 10px;
            font-size: 12px;
            border: 1px solid var(--border);
        }

        .step-section {
            margin-bottom: 10px;
        }

            .step-section label {
                font-size: 11px;
                color: var(--muted);
                margin-bottom: 6px;
            }

        .key-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
        }

        .key-chip {
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 3px 8px;
            font-family: monospace;
            font-size: 12px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 5px;
        }

            .key-chip button {
                background: none;
                color: var(--muted);
                font-size: 14px;
                padding: 0;
                line-height: 1;
                border-radius: 0;
            }

                .key-chip button:hover {
                    color: var(--red);
                }

        .add-key-row {
            display: flex;
            gap: 6px;
        }

            .add-key-row input {
                flex: 1;
            }

        .btn-add-key {
            background: var(--bg3);
            color: var(--text);
            padding: 6px 12px;
            border: 1px solid var(--border);
        }

        #btn-add-step {
            background: var(--bg3);
            color: var(--text);
            padding: 8px 16px;
            border: 1px dashed var(--border);
            width: 100%;
            margin-top: 4px;
        }

            #btn-add-step:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

        /* Action bar */
        .action-bar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

            .action-bar .spacer {
                flex: 1;
            }

        #btn-save {
            background: var(--accent);
            color: #000;
            font-weight: 700;
            padding: 9px 22px;
        }

        #btn-delete {
            background: var(--bg3);
            color: var(--red);
            padding: 9px 18px;
            border: 1px solid var(--border);
        }

        .no-script {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
            gap: 12px;
        }

            .no-script .icon {
                font-size: 48px;
                opacity: .3;
            }

            .no-script p {
                font-size: 14px;
            }

        /* Toast */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            pointer-events: none;
        }

        .toast {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            font-size: 13px;
            max-width: 320px;
            animation: slideIn .2s ease;
        }

            .toast.success {
                border-left: 3px solid var(--green);
            }

            .toast.error {
                border-left: 3px solid var(--red);
            }

        @keyframes slideIn {
            from {
                transform: translateX(20px);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        /* Key autocomplete dropdown */
        .key-input-wrap {
            position: relative;
        }

        .ac-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg2);
            border: 1px solid var(--accent);
            border-radius: 6px;
            z-index: 50;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 2px;
        }

            .ac-list div {
                padding: 6px 10px;
                font-family: monospace;
                font-size: 12px;
                cursor: pointer;
            }

                .ac-list div:hover, .ac-list div.active {
                    background: var(--bg3);
                    color: var(--accent2);
                }

        /* ── Pixel Trigger panel ──────────────────────────────────────────── */
        .pt-toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .switch {
            position: relative;
            width: 42px;
            height: 23px;
            flex-shrink: 0;
        }

            .switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .switch .slider {
                position: absolute;
                inset: 0;
                background: var(--bg3);
                border: 1px solid var(--border);
                border-radius: 23px;
                transition: background .15s;
            }

                .switch .slider::before {
                    content: '';
                    position: absolute;
                    width: 17px;
                    height: 17px;
                    left: 2px;
                    top: 2px;
                    background: var(--muted);
                    border-radius: 50%;
                    transition: transform .15s, background .15s;
                }

            .switch input:checked + .slider {
                background: var(--accent);
                border-color: var(--accent);
            }

                .switch input:checked + .slider::before {
                    transform: translateX(19px);
                    background: #000;
                }

        .pt-disabled-note {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.6;
            margin-top: 14px;
        }

        .pt-body {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .pt-sub {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .pt-sub-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .pt-coord-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

            .pt-coord-row .form-group {
                min-width: 90px;
            }

        .btn-sample {
            background: var(--bg3);
            color: var(--text);
            padding: 7px 13px;
            border: 1px solid var(--border);
            white-space: nowrap;
        }

            .btn-sample.counting {
                background: var(--accent);
                color: #000;
                border-color: var(--accent);
            }

            .btn-sample:disabled {
                opacity: .4;
                cursor: not-allowed;
            }

        .pt-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.5;
        }

        .pt-color-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .pt-color-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pt-swatch-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pt-swatch {
            width: 46px;
            height: 46px;
            border-radius: 6px;
            border: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg0);
        }

        .pt-rgb {
            font-family: monospace;
            font-size: 12px;
            color: var(--text);
            line-height: 1.5;
        }

            .pt-rgb .muted {
                color: var(--muted);
            }

        .pt-live-readout {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg0);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
        }

        .pt-verdict {
            font-family: monospace;
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: .04em;
            white-space: nowrap;
        }

            .pt-verdict.ready {
                background: #1d3d28;
                color: var(--green);
                border: 1px solid #2e6645;
            }

            .pt-verdict.waiting {
                background: #3a2d1a;
                color: var(--accent2);
                border: 1px solid #5e4a2e;
            }

            .pt-verdict.nomatch {
                background: #3d1d1d;
                color: var(--red);
                border: 1px solid #663030;
            }

            .pt-verdict.offline {
                background: var(--bg3);
                color: var(--muted);
                border: 1px solid var(--border);
            }
    </style>
</head>
<body>
    <div id="app">

        <!-- Header -->
        <header id="header">
            <h1>⚔ BestInScript</h1>
            <span class="tagline">ARPG Macro Engine</span>
            <div class="spacer"></div>
            <div id="status-dot"></div>
            <span id="status-label">Checking…</span>
            <button id="btn-stop-all">■ Stop All</button>
        </header>

        <!-- Body -->
        <div id="main">

            <!-- Sidebar -->
            <aside id="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-head">
                        <span>Scripts</span>
                        <button id="btn-new">+ New</button>
                    </div>
                    <div id="script-list" class="sidebar-list"></div>
                </div>
                <div class="sidebar-section">
                    <div class="sidebar-head">
                        <span>Presets</span>
                        <button id="btn-new-preset">+ New</button>
                    </div>
                    <div id="preset-list" class="sidebar-list"></div>
                </div>
            </aside>

            <!-- Editor -->
            <main id="editor">
                <div class="no-script" id="no-script">
                    <div class="icon">🎮</div>
                    <p>Select a script or click <strong>+ New</strong> to create one.</p>
                </div>
                <!-- editor content injected by JS -->
            </main>

        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // ── Constants ────────────────────────────────────────────────────────────────
        const API = `${window.location.origin}/api`;

        const ALL_KEYS = [
            ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),
            ...Array.from({ length: 10 }, (_, i) => String(i)),
            ...Array.from({ length: 12 }, (_, i) => `F${i + 1}`),
            ...Array.from({ length: 10 }, (_, i) => `NumPad${i}`),
            'Space', 'Enter', 'Tab', 'Escape', 'Backspace', 'Delete', 'Insert',
            'Home', 'End', 'PageUp', 'PageDown', 'Up', 'Down', 'Left', 'Right',
            'Shift', 'LShift', 'RShift', 'Ctrl', 'LCtrl', 'RCtrl', 'Alt', 'LAlt', 'RAlt',
            'Multiply', 'Add', 'Subtract', 'Decimal', 'Divide',
            'Mouse1', 'Mouse2', 'Mouse3', 'Mouse4', 'Mouse5'
        ];

        const TRIGGER_KEYS = ALL_KEYS.filter(k => !k.startsWith('Mouse'));

        // ── State ────────────────────────────────────────────────────────────────────
        let scripts = [];
        let statuses = {};

        let presets = [];
        let presetStatuses = {};

        // The thing currently in the editor.
        //   selectedKind: 'script' | 'preset' | null
        //   selected:     ScriptConfig or Preset object (always a deep copy)
        let selected = null;
        let selectedKind = null;
        let isNew = false;
        let capturing = false;

        // Pixel-trigger UI state
        let pixelLiveTimer = null;   // setInterval handle for the live readout
        let sampleBusy = false;      // a countdown sample is in progress

        // ── Bootstrap ────────────────────────────────────────────────────────────────
        (async () => {
            await loadScripts();
            await loadPresets();
            renderSidebar();
            showNoScript();
            pollStatus();
        })();

        // ── Data ─────────────────────────────────────────────────────────────────────
        async function loadScripts() {
            try {
                const r = await fetch(`${API}/scripts`);
                scripts = await r.json();
            } catch { scripts = []; }
        }

        async function loadPresets() {
            try {
                const r = await fetch(`${API}/presets`);
                presets = await r.json();
            } catch { presets = []; }
        }

        async function pollStatus() {
            try {
                const [sr, pr] = await Promise.all([
                    fetch(`${API}/engine/status`),
                    fetch(`${API}/presets/status`)
                ]);
                const scriptList = await sr.json();
                const presetList = await pr.json();
                statuses = {};
                scriptList.forEach(s => statuses[s.id] = s.isRunning);
                presetStatuses = {};
                presetList.forEach(p => presetStatuses[p.id] = p.isActive);
                document.getElementById('status-dot').classList.remove('error');
                document.getElementById('status-label').textContent = 'Engine running';
                renderSidebarCards();
            } catch {
                document.getElementById('status-dot').classList.add('error');
                document.getElementById('status-label').textContent = 'API offline';
            }
            setTimeout(pollStatus, 2000);
        }

        // ── Sidebar ───────────────────────────────────────────────────────────────────
        function renderSidebar() {
            renderSidebarCards();
        }

        function renderSidebarCards() {
            renderScriptCards();
            renderPresetCards();
        }

        function renderScriptCards() {
            const el = document.getElementById('script-list');
            if (!scripts.length) {
                el.innerHTML = '<div class="empty-state">No scripts yet.<br>Click <strong>+ New</strong> to get started.</div>';
                return;
            }
            el.innerHTML = scripts.map(s => {
                const running = !!statuses[s.id];
                const sel = selectedKind === 'script' && selected && selected.id === s.id ? 'selected' : '';
                const pixelTag = s.pixelTrigger ? ' · 👁 pixel' : '';
                const overlayTag = s.showInOverlay ? ' · 📺 overlay' : '';
                return `
          <div class="script-card ${sel}" data-id="${s.id}" onclick="selectScript('${s.id}')">
            <div class="key-badge">${esc(s.triggerKey)}</div>
            <div class="info">
              <div class="name">${esc(s.name)}</div>
              <div class="meta">${s.steps.length} step${s.steps.length !== 1 ? 's' : ''} · ${s.delayMin}–${s.delayMax}s${pixelTag}${overlayTag}</div>
            </div>
            ${running ? '<div class="running-pill">● ON</div>' : ''}
          </div>`;
            }).join('');
        }

        function renderPresetCards() {
            const el = document.getElementById('preset-list');
            if (!presets.length) {
                el.innerHTML = '<div class="empty-state">No presets yet.<br>Click <strong>+ New</strong> to group scripts.</div>';
                return;
            }
            el.innerHTML = presets.map(p => {
                const active = !!presetStatuses[p.id];
                const sel = selectedKind === 'preset' && selected && selected.id === p.id ? 'selected' : '';
                const overlayTag = p.showInOverlay ? ' · 📺 overlay' : '';
                const count = (p.scriptIds || []).length;
                return `
          <div class="script-card preset-card ${sel}" data-id="${p.id}" onclick="selectPreset('${p.id}')">
            <div class="key-badge">${esc(p.triggerKey)}</div>
            <div class="info">
              <div class="name">${esc(p.name)}</div>
              <div class="meta">${count} script${count !== 1 ? 's' : ''}${overlayTag}</div>
            </div>
            ${active ? '<div class="running-pill">● ON</div>' : ''}
          </div>`;
            }).join('');
        }

        // ── Selection ─────────────────────────────────────────────────────────────────
        function selectScript(id) {
            const s = scripts.find(x => x.id === id);
            if (!s) return;
            stopPixelLive();
            isNew = false;
            selectedKind = 'script';
            selected = JSON.parse(JSON.stringify(s)); // deep copy
            renderEditor();
        }

        function newScript() {
            stopPixelLive();
            isNew = true;
            selectedKind = 'script';
            selected = {
                id: null, name: 'New Script', triggerKey: '3',
                steps: [{ hold: [], press: [] }], delayMin: 0.4, delayMax: 0.6,
                pixelTrigger: null,
                showInOverlay: false
            };
            renderEditor();
        }

        function selectPreset(id) {
            const p = presets.find(x => x.id === id);
            if (!p) return;
            stopPixelLive();
            isNew = false;
            selectedKind = 'preset';
            selected = JSON.parse(JSON.stringify(p));
            if (!Array.isArray(selected.scriptIds)) selected.scriptIds = [];
            renderEditor();
        }

        function newPreset() {
            stopPixelLive();
            isNew = true;
            selectedKind = 'preset';
            selected = {
                id: null,
                name: 'New Preset',
                triggerKey: 'F1',
                scriptIds: [],
                showInOverlay: false

            document.querySelectorAll('#editor .panel, #editor .action-bar').forEach(el => el.remove());

            renderScriptEditor();

        function renderScriptEditor() {

            editor.appendChild(basic);

            // ── Pixel trigger panel ──
            const pixelPanel = mkPanel('Pixel Trigger — Autocast', `
        <div class="pt-toggle-row">

            <div style="font-weight:600;font-size:13px;color:var(--text)">

            </div>

        // ── Preset editor ─────────────────────────────────────────────────────────────
        function renderPresetEditor() {
            stopPixelLive();

            const noScript = document.getElementById('no-script');
            noScript.style.display = 'none';
            document.querySelectorAll('#editor .panel, #editor .action-bar').forEach(el => el.remove());

            const editor = document.getElementById('editor');

            const basic = mkPanel('Preset Settings', `
        <div class="form-row">
          <div class="form-group full">
            <label>Preset Name <span style="color:var(--muted);font-weight:400;text-transform:none">(this is the save name)</span></label>

            editor.appendChild(basic);

            const membersPanel = mkPanel('Member Scripts', `

            editor.appendChild(membersPanel);
            renderMemberList();

            const bar = document.createElement('div');
            bar.className = 'action-bar';
            bar.innerHTML = `
        <button id="btn-delete" onclick="deletePreset()" ${isNew ? 'style="display:none"' : ''}>🗑 Delete</button>
        <div class="spacer"></div>
        <button id="btn-save" onclick="savePreset()">💾 Save Preset</button>
      `;
            editor.appendChild(bar);

            renderSidebarCards();

        function renderMemberList() {
            const list = document.getElementById('member-list');
            if (!list) return;
            if (!scripts.length) {
                list.innerHTML = '<div class="empty-state" style="padding:18px">No scripts to group. Create some scripts first.</div>';
                return;
            }
            const owned = new Set(selected.scriptIds || []);
            list.innerHTML = scripts.map(s => {
                const checked = owned.has(s.id);
                return `
          <label class="member-row ${checked ? 'checked' : ''}" data-id="${s.id}">
            <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleMember('${s.id}', this.checked)" />

            <div class="key">${esc(s.triggerKey)}</div>
          </label>`;
            }).join('');
        }

        function toggleMember(id, on) {
            const set = new Set(selected.scriptIds || []);
            if (on) set.add(id); else set.delete(id);
            selected.scriptIds = [...set];
            renderMemberList();
        }

        // ── Steps rendering ────────────────────────────────────────────────────────────
        function renderSteps() {
            const list = document.getElementById('steps-list');
            if (!list) return;
            list.innerHTML = '';
            selected.steps.forEach((step, i) => {
                const card = document.createElement('div');
                card.className = 'step-card';
                card.dataset.idx = i;
                card.innerHTML = `
          <div class="step-header">
            <span class="step-number">STEP ${i + 1}</span>
            <span></span>
            <button class="btn-remove-step" onclick="removeStep(${i})">✕ Remove</button>
          </div>
          <div class="step-section">
            <label>Hold Keys <span style="font-weight:400;text-transform:none;color:var(--muted)">(held down for entire step)</span></label>
            <div class="key-chips" id="hold-chips-${i}"></div>
            <div class="add-key-row">
              <div class="key-input-wrap" style="flex:1">
                <input id="hold-input-${i}" type="text" placeholder="e.g. Shift, Ctrl" autocomplete="off"
                  oninput="showAC(this,'hold',${i})" onkeydown="keyInputDown(event,'hold',${i})" />
                <div class="ac-list" id="hold-ac-${i}" style="display:none"></div>
              </div>
              <button class="btn-add-key" onclick="addKey('hold',${i})">+ Add</button>
            </div>
          </div>
          <div class="step-section" style="margin-bottom:0">
            <label>Press Keys <span style="font-weight:400;text-transform:none;color:var(--muted)">(tap once per step)</span></label>
            <div class="key-chips" id="press-chips-${i}"></div>
            <div class="add-key-row">
              <div class="key-input-wrap" style="flex:1">
                <input id="press-input-${i}" type="text" placeholder="e.g. Mouse1, Q, E" autocomplete="off"
                  oninput="showAC(this,'press',${i})" onkeydown="keyInputDown(event,'press',${i})" />
                <div class="ac-list" id="press-ac-${i}" style="display:none"></div>
              </div>
              <button class="btn-add-key" onclick="addKey('press',${i})">+ Add</button>
            </div>
          </div>
        `;
                list.appendChild(card);
                renderChips('hold', i);
                renderChips('press', i);
            });
        }

        function renderChips(type, idx) {
            const step = selected.steps[idx];
            const arr = type === 'hold' ? step.hold : step.press;
            const el = document.getElementById(`${type}-chips-${idx}`);
            if (!el) return;
            el.innerHTML = arr.map((k, ki) => `
        <div class="key-chip">
          <span>${esc(k)}</span>
          <button onclick="removeKey('${type}',${idx},${ki})">×</button>
        </div>`).join('');
        }

        function addStep() {
            selected.steps.push({ hold: [], press: [] });
            renderSteps();
        }

        function removeStep(idx) {
            selected.steps.splice(idx, 1);
            renderSteps();
        }

        function addKey(type, idx) {
            const input = document.getElementById(`${type}-input-${idx}`);
            const val = input.value.trim();
            if (!val) return;
            const normalized = val.toUpperCase() === val ? val : val.charAt(0).toUpperCase() + val.slice(1);
            const match = ALL_KEYS.find(k => k.toUpperCase() === normalized.toUpperCase());
            if (!match) { toast(`Unknown key: ${val}`, 'error'); return; }
            const arr = type === 'hold' ? selected.steps[idx].hold : selected.steps[idx].press;
            if (!arr.includes(match)) arr.push(match);
            input.value = '';
            closeAC(type, idx);
            renderChips(type, idx);
        }

        function removeKey(type, idx, ki) {
            const arr = type === 'hold' ? selected.steps[idx].hold : selected.steps[idx].press;
            arr.splice(ki, 1);
            renderChips(type, idx);
        }

        function keyInputDown(e, type, idx) {
            const acId = `${type}-ac-${idx}`;
            const ac = document.getElementById(acId);
            if (e.key === 'Enter') { addKey(type, idx); return; }
            if (e.key === 'Escape') { closeAC(type, idx); return; }
            if (ac && ac.style.display !== 'none') {
                const items = ac.querySelectorAll('div');
                const cur = ac.querySelector('div.active');
                let idx2 = [...items].indexOf(cur);
                if (e.key === 'ArrowDown') { e.preventDefault(); idx2 = Math.min(idx2 + 1, items.length - 1); }
                if (e.key === 'ArrowUp') { e.preventDefault(); idx2 = Math.max(idx2 - 1, 0); }
                items.forEach((it, i) => it.classList.toggle('active', i === idx2));
                if (cur) cur.scrollIntoView({ block: 'nearest' });
            }
        }

        // ── Autocomplete ──────────────────────────────────────────────────────────────
        function showAC(input, type, idx) {
            const q = input.value.trim().toUpperCase();
            const acEl = document.getElementById(`${type}-ac-${idx}`);
            if (!q) { acEl.style.display = 'none'; return; }
            const matches = ALL_KEYS.filter(k => k.toUpperCase().startsWith(q)).slice(0, 10);
            if (!matches.length) { acEl.style.display = 'none'; return; }
            acEl.innerHTML = matches.map(k =>
                `<div onclick="pickAC('${k}','${type}',${idx})">${k}</div>`).join('');
            acEl.style.display = 'block';
        }

        function pickAC(key, type, idx) {
            document.getElementById(`${type}-input-${idx}`).value = key;
            closeAC(type, idx);
            addKey(type, idx);
        }

        function closeAC(type, idx) {
            const el = document.getElementById(`${type}-ac-${idx}`);
            if (el) el.style.display = 'none';
        }

        // ── Trigger key capture ────────────────────────────────────────────────────────
        function startCapture() {
            if (capturing) return;
            capturing = true;
            const btn = document.getElementById('btn-capture');
            const dis = document.getElementById('trigger-display');
            btn.classList.add('listening');
            btn.textContent = '⌨ Press any key…';
            dis.textContent = '…';

            function onKey(e) {
                e.preventDefault();
                e.stopPropagation();
                // Map key event to our key name
                const name = mapEventKey(e);
                if (!name || !TRIGGER_KEYS.includes(name)) {
                    toast('Invalid trigger key (mouse buttons not allowed here)', 'error');
                    reset();
                    return;
                }
                selected.triggerKey = name;
                dis.textContent = name;
                reset();
            }

            function reset() {
                capturing = false;
                btn.classList.remove('listening');
                btn.textContent = 'Click to Capture';
                document.removeEventListener('keydown', onKey, true);
            }

            document.addEventListener('keydown', onKey, true);
        }

        function mapEventKey(e) {
            const code = e.code; // e.g. "KeyA", "Digit3", "F1", "ShiftLeft"
            if (code.startsWith('Key')) return code.slice(3);         // KeyA → A
            if (code.startsWith('Digit')) return code.slice(5);         // Digit3 → 3
            if (code.startsWith('F') && !isNaN(code.slice(1))) return code; // F1..F12
            const map = {
                'Space': 'Space', 'Enter': 'Enter', 'Tab': 'Tab', 'Escape': 'Escape',
                'Backspace': 'Backspace', 'Delete': 'Delete', 'Insert': 'Insert',
                'Home': 'Home', 'End': 'End', 'PageUp': 'PageUp', 'PageDown': 'PageDown',
                'ArrowUp': 'Up', 'ArrowDown': 'Down', 'ArrowLeft': 'Left', 'ArrowRight': 'Right',
                'ShiftLeft': 'LShift', 'ShiftRight': 'RShift',
                'ControlLeft': 'LCtrl', 'ControlRight': 'RCtrl',
                'AltLeft': 'LAlt', 'AltRight': 'RAlt',
                'Numpad0': 'NumPad0', 'Numpad1': 'NumPad1', 'Numpad2': 'NumPad2',
                'Numpad3': 'NumPad3', 'Numpad4': 'NumPad4', 'Numpad5': 'NumPad5',
                'Numpad6': 'NumPad6', 'Numpad7': 'NumPad7', 'Numpad8': 'NumPad8', 'Numpad9': 'NumPad9',
                'NumpadMultiply': 'Multiply', 'NumpadAdd': 'Add', 'NumpadSubtract': 'Subtract',
                'NumpadDecimal': 'Decimal', 'NumpadDivide': 'Divide',
            };
            return map[code] || null;
        }

        // ── Delay sliders ─────────────────────────────────────────────────────────────
        function syncDelay() {
            const minEl = document.getElementById('f-dmin');
            const maxEl = document.getElementById('f-dmax');
            let mn = parseFloat(minEl.value);
            let mx = parseFloat(maxEl.value);
            if (mn > mx) { mx = mn; maxEl.value = mx; }
            document.getElementById('lbl-dmin').textContent = mn.toFixed(2) + 's';
            document.getElementById('lbl-dmax').textContent = mx.toFixed(2) + 's';
            selected.delayMin = mn;
            selected.delayMax = mx;
        }

        function syncShowOverlay(value) {
            selected.showInOverlay = !!value;
            renderSidebarCards();   // update the small "📺 overlay" tag live
        }

        // ══ Pixel Trigger ═════════════════════════════════════════════════════════════
        function defaultPixelTrigger() {
            return {
                x: 0, y: 0,
                readyColor: [255, 255, 255],
                cooldownColor: [60, 60, 60],
                tolerance: 40,
                reArmDelayMs: 250,
                pollIntervalMs: 75,
                sampleRadius: 1,
                requireReset: false
            };
        }

        function togglePixelTrigger(enabled) {
            if (enabled) {
                selected.pixelTrigger = selected.pixelTrigger || defaultPixelTrigger();
            } else {
                stopPixelLive();
                selected.pixelTrigger = null;
            }
            renderPixelPanel();
            renderSidebarCards();
        }

        function renderPixelPanel() {
            const wrap = document.getElementById('pt-body-wrap');
            if (!wrap) return;
            const pt = selected.pixelTrigger;

            if (!pt) {
                stopPixelLive();
                wrap.innerHTML = `<div class="pt-disabled-note">
          Pixel trigger is <strong>off</strong> — this script loops its steps continuously
          while toggled on (the standard behavior). Enable it to gate the steps on a screen
          color instead, e.g. to recast a cooldown skill the instant its icon lights up again.
        </div>`;
                return;
            }

            wrap.innerHTML = `
        <div class="pt-body">

          <div class="pt-sub">
            <div class="pt-sub-title">Watched Pixel</div>
            <div class="pt-coord-row">
              <div class="form-group">
                <label>Screen X</label>
                <input type="number" id="pt-x" value="${pt.x}" oninput="syncPixelField('x',this.value)" />
              </div>
              <div class="form-group">
                <label>Screen Y</label>
                <input type="number" id="pt-y" value="${pt.y}" oninput="syncPixelField('y',this.value)" />
              </div>
              <button class="btn-sample" id="pt-sample-pos" onclick="samplePixelPosition()">📍 Sample at cursor</button>
            </div>
            <div class="pt-hint">
              Click <strong>Sample at cursor</strong>, then you have 3 seconds to hover your
              mouse over the skill icon in-game — the pixel under the cursor is captured.
            </div>
          </div>

          <div class="pt-sub">
            <div class="pt-sub-title">Reference Colors</div>
            <div class="pt-color-grid">
              <div class="pt-color-box">
                <div class="pt-swatch-row">
                  <div class="pt-swatch" id="pt-ready-swatch"></div>
                  <div class="pt-rgb" id="pt-ready-rgb"></div>
                </div>
                <button class="btn-sample" id="pt-sample-ready" onclick="sampleColor('ready')">Capture ready color</button>
                <div class="pt-hint">Capture while the skill is <strong>OFF</strong> cooldown (icon bright / lit).</div>
              </div>
              <div class="pt-color-box">
                <div class="pt-swatch-row">
                  <div class="pt-swatch" id="pt-cool-swatch"></div>
                  <div class="pt-rgb" id="pt-cool-rgb"></div>
                </div>
                <button class="btn-sample" id="pt-sample-cool" onclick="sampleColor('cooldown')">Capture cooldown color</button>
                <div class="pt-hint">Capture while the skill is <strong>ON</strong> cooldown (icon dark / greyed).</div>
              </div>
            </div>
            <div class="pt-hint" id="pt-color-status" style="margin-top:12px"></div>
          </div>

          <div class="pt-sub">
            <div class="pt-sub-title">Matching &amp; Timing</div>

            <div class="pt-toggle-row" style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border)">
              <label class="switch">
                <input type="checkbox" id="pt-require-reset" ${pt.requireReset ? 'checked' : ''}
                  onchange="syncPixelBool('requireReset', this.checked)" />
                <span class="slider"></span>
              </label>
              <div>
                <div style="font-weight:600;font-size:13px;color:var(--text)">
                  One-shot — require reset between fires
                </div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px;line-height:1.5">
                  Fire <strong>once</strong> when the pixel becomes ready, then wait until it
                  returns to a non-ready state before it can fire again. Use this for actions
                  that should run exactly once per cycle (vs. continuous autocast, which
                  re-fires the moment the pixel is ready again).
                </div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group full">
                <label>Tolerance <span class="val" id="pt-tol-lbl" style="font-family:monospace;color:var(--accent2);float:right">${pt.tolerance}</span></label>
                <input type="range" id="pt-tol" min="0" max="150" step="5" value="${pt.tolerance}"
                  oninput="syncPixelField('tolerance',this.value)" />
                <div class="pt-hint">How far the live pixel may differ from the ready color and still count as ready. Lower = stricter.</div>
              </div>
              <div class="form-group">
                <label>Re-arm Delay (ms)</label>
                <input type="number" id="pt-rearm" min="0" step="25" value="${pt.reArmDelayMs}"
                  oninput="syncPixelField('reArmDelayMs',this.value)" />
                <div class="pt-hint">Pause after firing before it can fire again.</div>
              </div>
              <div class="form-group">
                <label>Poll Interval (ms)</label>
                <input type="number" id="pt-poll" min="15" step="5" value="${pt.pollIntervalMs}"
                  oninput="syncPixelField('pollIntervalMs',this.value)" />
                <div class="pt-hint">How often the pixel is checked while waiting.</div>
              </div>
              <div class="form-group full">
                <label>Sample Area</label>
                <select id="pt-radius" onchange="syncPixelField('sampleRadius',this.value)">
                  <option value="0">Single pixel</option>
                  <option value="1">3 × 3 average</option>
                  <option value="2">5 × 5 average</option>
                  <option value="3">7 × 7 average</option>
                </select>
                <div class="pt-hint">Averaging a small area steadies the reading against icon-edge highlights and animation flicker.</div>
              </div>
            </div>
          </div>

          <div class="pt-sub">
            <div class="pt-sub-title">Live Test</div>
            <div class="pt-live-readout">
              <button class="btn-sample" id="pt-live-btn" onclick="togglePixelLive()">▶ Start live readout</button>
              <div class="pt-swatch" id="pt-live-swatch" style="width:32px;height:32px"></div>
              <div class="pt-rgb" id="pt-live-rgb"><span class="muted">— not running —</span></div>
              <div style="flex:1"></div>
              <div class="pt-verdict offline" id="pt-verdict">IDLE</div>
            </div>
            <div class="pt-hint">
              Polls the watched pixel live and shows whether the engine would fire right now —
              tune tolerance until READY / WAITING track the skill's real state.
            </div>
          </div>

        </div>`;

            // Populate the dynamic bits that can't be inlined above
            document.getElementById('pt-radius').value = String(pt.sampleRadius);
            updatePixelSwatches();
            updateColorStatus();
        }

        function syncPixelField(field, value) {
            const pt = selected.pixelTrigger;
            if (!pt) return;
            const n = parseInt(value, 10);
            pt[field] = isNaN(n) ? 0 : n;
            if (field === 'tolerance') {
                const lbl = document.getElementById('pt-tol-lbl');
                if (lbl) lbl.textContent = pt.tolerance;
            }
        }

        function syncPixelBool(field, value) {
            const pt = selected.pixelTrigger;
            if (!pt) return;
            pt[field] = !!value;
        }

        function updatePixelSwatches() {
            const pt = selected.pixelTrigger;
            if (!pt) return;
            const rc = pt.readyColor, cc = pt.cooldownColor;
            const set = (swId, rgbId, c) => {
                const sw = document.getElementById(swId);
                const rgb = document.getElementById(rgbId);
                if (sw) sw.style.background = `rgb(${c[0]},${c[1]},${c[2]})`;
                if (rgb) rgb.innerHTML = `R ${c[0]}<br>G ${c[1]}<br>B ${c[2]}`;
            };
            set('pt-ready-swatch', 'pt-ready-rgb', rc);
            set('pt-cool-swatch', 'pt-cool-rgb', cc);
        }

        function updateColorStatus() {
            const el = document.getElementById('pt-color-status');
            if (!el) return;
            const pt = selected.pixelTrigger;
            const d = colorDistance(pt.readyColor, pt.cooldownColor);
            if (d < 25) {
                el.innerHTML = `⚠ Ready and cooldown colors are nearly identical (separation ${d.toFixed(0)}). ` +
                    `The trigger will be unreliable — pick a pixel where the icon changes more dramatically between states.`;
                el.style.color = 'var(--red)';
            } else {
                el.innerHTML = `Color separation: <strong>${d.toFixed(0)}</strong>. ` +
                    `Any tolerance below this cleanly distinguishes the two states — try around ${Math.round(d / 2)}.`;
                el.style.color = 'var(--muted)';
            }
        }

        function colorDistance(a, b) {
            const dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2];
            return Math.sqrt(dr * dr + dg * dg + db * db);
        }

        // ── Sampling (countdown → capture) ────────────────────────────────────────────
        function countdownButton(btn, baseLabel, secs, action) {
            if (!btn || sampleBusy) return;
            sampleBusy = true;
            setSampleButtonsDisabled(true);
            btn.disabled = false;
            btn.classList.add('counting');
            let remaining = secs;
            btn.textContent = `Capturing in ${remaining}…`;
            const iv = setInterval(async () => {
                remaining--;
                if (remaining > 0) {
                    btn.textContent = `Capturing in ${remaining}…`;
                    return;
                }
                clearInterval(iv);
                btn.textContent = 'Capturing…';
                try { await action(); }
                finally {
                    btn.classList.remove('counting');
                    btn.textContent = baseLabel;
                    sampleBusy = false;
                    setSampleButtonsDisabled(false);
                }
            }, 1000);
        }

        function setSampleButtonsDisabled(disabled) {
            ['pt-sample-pos', 'pt-sample-ready', 'pt-sample-cool'].forEach(id => {
                const b = document.getElementById(id);
                if (b && !b.classList.contains('counting')) b.disabled = disabled;
            });
        }

        function samplePixelPosition() {
            const btn = document.getElementById('pt-sample-pos');
            countdownButton(btn, '📍 Sample at cursor', 3, async () => {
                const pt = selected.pixelTrigger;
                if (!pt) return;
                try {
                    const r = await fetch(`${API}/screen/cursor?radius=${pt.sampleRadius}`);
                    if (!r.ok) { toast('Could not read cursor position', 'error'); return; }
                    const d = await r.json();
                    pt.x = d.x; pt.y = d.y;
                    const xEl = document.getElementById('pt-x');
                    const yEl = document.getElementById('pt-y');
                    if (xEl) xEl.value = d.x;
                    if (yEl) yEl.value = d.y;
                    if (d.readable) {
                        toast(`Pixel set to (${d.x}, ${d.y})`, 'success');
                    } else {
                        toast(`Position (${d.x}, ${d.y}) set, but the screen is unreadable there — fullscreen-exclusive game?`, 'error');
                    }
                } catch (e) {
                    toast('Network error: ' + e.message, 'error');
                }
            });
        }

        function sampleColor(which) {
            const pt = selected.pixelTrigger;
            if (!pt) return;
            const btnId = which === 'ready' ? 'pt-sample-ready' : 'pt-sample-cool';
            const baseLabel = which === 'ready' ? 'Capture ready color' : 'Capture cooldown color';
            const btn = document.getElementById(btnId);
            countdownButton(btn, baseLabel, 3, async () => {
                try {
                    const r = await fetch(`${API}/screen/color?x=${pt.x}&y=${pt.y}&radius=${pt.sampleRadius}`);
                    if (!r.ok) {
                        toast('Screen unreadable at that pixel — is the game fullscreen-exclusive?', 'error');
                        return;
                    }
                    const d = await r.json();
                    const col = [d.r, d.g, d.b];
                    if (which === 'ready') pt.readyColor = col;
                    else pt.cooldownColor = col;
                    updatePixelSwatches();
                    updateColorStatus();
                    toast(`${which === 'ready' ? 'Ready' : 'Cooldown'} color captured — rgb(${d.r}, ${d.g}, ${d.b})`, 'success');
                } catch (e) {
                    toast('Network error: ' + e.message, 'error');
                }
            });
        }

        // ── Live readout ──────────────────────────────────────────────────────────────
        function togglePixelLive() {
            if (pixelLiveTimer) stopPixelLive();
            else startPixelLive();
        }

        function startPixelLive() {
            const btn = document.getElementById('pt-live-btn');
            if (!btn) return;
            btn.textContent = '■ Stop live readout';

            const tick = async () => {
                const pt = selected && selected.pixelTrigger;
                if (!pt) { stopPixelLive(); return; }
                try {
                    const r = await fetch(`${API}/screen/color?x=${pt.x}&y=${pt.y}&radius=${pt.sampleRadius}`);
                    if (!r.ok) { setLiveVerdict('offline', 'UNREADABLE', null); return; }
                    const d = await r.json();
                    const col = [d.r, d.g, d.b];
                    const dReady = colorDistance(col, pt.readyColor);
                    const dCool = colorDistance(col, pt.cooldownColor);
                    let verdict, cls;
                    if (dReady <= pt.tolerance && dReady < dCool) {
                        verdict = pt.requireReset
                            ? 'READY → fires on first match'
                            : 'READY → would fire';
                        cls = 'ready';
                    } else if (dCool < dReady) {
                        verdict = 'WAITING (cooldown)'; cls = 'waiting';
                    } else {
                        verdict = 'NO MATCH'; cls = 'nomatch';
                    }
                    setLiveVerdict(cls, verdict, col);
                } catch {
                    setLiveVerdict('offline', 'API OFFLINE', null);
                }
            };

            tick();
            pixelLiveTimer = setInterval(tick, 400);
        }

        function stopPixelLive() {
            if (pixelLiveTimer) { clearInterval(pixelLiveTimer); pixelLiveTimer = null; }
            const btn = document.getElementById('pt-live-btn');
            if (btn) btn.textContent = '▶ Start live readout';
            const rgb = document.getElementById('pt-live-rgb');
            const sw = document.getElementById('pt-live-swatch');
            const v = document.getElementById('pt-verdict');
            if (rgb) rgb.innerHTML = '<span class="muted">— not running —</span>';
            if (sw) sw.style.background = 'var(--bg0)';
            if (v) { v.className = 'pt-verdict offline'; v.textContent = 'IDLE'; }
        }

        function setLiveVerdict(cls, text, col) {
            const rgb = document.getElementById('pt-live-rgb');
            const sw = document.getElementById('pt-live-swatch');
            const v = document.getElementById('pt-verdict');
            if (v) { v.className = 'pt-verdict ' + cls; v.textContent = text; }
            if (col) {
                if (sw) sw.style.background = `rgb(${col[0]},${col[1]},${col[2]})`;
                if (rgb) rgb.innerHTML = `R ${col[0]} &nbsp; G ${col[1]} &nbsp; B ${col[2]}`;
            } else {
                if (sw) sw.style.background = 'var(--bg0)';
                if (rgb) rgb.innerHTML = '<span class="muted">—</span>';
            }
        }

        // ── Save / Delete ──────────────────────────────────────────────────────────────
        async function saveScript() {
            selected.name = document.getElementById('f-name').value.trim();
            syncDelay();

            if (!selected.name) { toast('Script name is required.', 'error'); return; }

            const payload = {
                id: selected.id || '00000000-0000-0000-0000-000000000000',
                name: selected.name,
                triggerKey: selected.triggerKey,
                steps: selected.steps,
                delayMin: selected.delayMin,
                delayMax: selected.delayMax,
                pixelTrigger: selected.pixelTrigger || null,
                showInOverlay: !!selected.showInOverlay
            };

            try {
                let r;
                if (isNew) {
                    r = await fetch(`${API}/scripts`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    r = await fetch(`${API}/scripts/${selected.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                if (!r.ok) {
                    const txt = await r.text();
                    toast('Save failed: ' + txt, 'error');
                    return;
                }
                const saved = await r.json();
                selected = saved;
                isNew = false;
                await loadScripts();
                renderSidebar();
                renderEditor();
                toast(`"${saved.name}" saved ✓`, 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        async function deleteScript() {
            if (!selected || isNew) return;
            if (!confirm(`Delete "${selected.name}"? This cannot be undone.`)) return;
            try {
                const r = await fetch(`${API}/scripts/${selected.id}`, { method: 'DELETE' });
                if (!r.ok) { toast('Delete failed', 'error'); return; }
                await loadScripts();
                showNoScript();
                renderSidebar();
                toast('Script deleted.', 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        async function savePreset() {
            selected.name = document.getElementById('f-name').value.trim();
            if (!selected.name) { toast('Preset name is required.', 'error'); return; }

            const payload = {
                id: selected.id || '00000000-0000-0000-0000-000000000000',
                name: selected.name,
                triggerKey: selected.triggerKey,
                scriptIds: selected.scriptIds || [],
                showInOverlay: !!selected.showInOverlay
            };

            try {
                const url = isNew ? `${API}/presets` : `${API}/presets/${selected.id}`;
                const method = isNew ? 'POST' : 'PUT';
                const r = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!r.ok) {
                    const txt = await r.text();
                    toast('Save failed: ' + txt, 'error');
                    return;
                }
                const saved = await r.json();
                selected = saved;
                if (!Array.isArray(selected.scriptIds)) selected.scriptIds = [];
                isNew = false;
                await loadPresets();
                renderSidebar();
                renderEditor();
                toast(`"${saved.name}" saved ✓`, 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        async function deletePreset() {
            if (!selected || isNew) return;
            if (!confirm(`Delete preset "${selected.name}"? This cannot be undone.`)) return;
            try {
                const r = await fetch(`${API}/presets/${selected.id}`, { method: 'DELETE' });
                if (!r.ok) { toast('Delete failed', 'error'); return; }
                await loadPresets();
                showNoScript();
                renderSidebar();
                toast('Preset deleted.', 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        // ── Stop all ──────────────────────────────────────────────────────────────────
        document.getElementById('btn-stop-all').addEventListener('click', async () => {
            try {
                await fetch(`${API}/engine/stop-all`, { method: 'POST' });
                toast('All scripts stopped.', 'success');
            } catch { toast('Could not reach API.', 'error'); }
        });

        // ── New script / preset ───────────────────────────────────────────────────────
        document.getElementById('btn-new').addEventListener('click', newScript);
        document.getElementById('btn-new-preset').addEventListener('click', newPreset);

        // ── Toast ─────────────────────────────────────────────────────────────────────
        function toast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3200);
        }

        // ── Utils ─────────────────────────────────────────────────────────────────────
        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Close autocomplete on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('.key-input-wrap'))
                document.querySelectorAll('.ac-list').forEach(el => el.style.display = 'none');
        });
    </script>

                        <button type="button" data-a="MiddleCenter" title="Center"></button>
                        <button type="button" data-a="MiddleRight" title="Middle right"></button>
                        <button type="button" data-a="BottomLeft" title="Bottom left"></button>
                        <button type="button" data-a="BottomCenter" title="Bottom center"></button>
                        <button type="button" data-a="BottomRight" title="Bottom right"></button>
                    </div>
                </div>

                <div class="row">
                    <label for="bis-ov-margin">Margin</label>
                    <input type="number" id="bis-ov-margin" min="0" max="400" step="2">
                </div>
                <div class="row">
                    <label for="bis-ov-opacity">Opacity</label>
                    <input type="number" id="bis-ov-opacity" min="0.1" max="1" step="0.05">
                </div>
                <div class="row">
                    <label for="bis-ov-fontsize">Font size</label>
                    <input type="number" id="bis-ov-fontsize" min="8" max="32" step="1">
                </div>
            </div>

            <footer>
                <button id="bis-ov-save" type="button">Save</button>
                <span id="bis-ov-saved">Saved</span>
            </footer>
        </div>
    </div>

    <script>
        (function () {
            const $ = id => document.getElementById(id);

            // 1. Inject the trigger button into the existing header, just before "Stop All".
            const stopBtn = $('btn-stop-all');
            if (stopBtn && !$('bis-ov-trigger')) {
                const btn = document.createElement('button');
                btn.id = 'bis-ov-trigger';
                btn.type = 'button';
                btn.textContent = '⚙ Overlay';
                stopBtn.parentNode.insertBefore(btn, stopBtn);
            }

            const els = {
                trigger: $('bis-ov-trigger'),
                backdrop: $('bis-ov-backdrop'),
                dialog: $('bis-ov-dialog'),
                close: $('bis-ov-close'),
                error: $('bis-ov-error'),
                enabled: $('bis-ov-enabled'),
                hideIdle: $('bis-ov-hideidle'),
                screen: $('bis-ov-screen'),
                anchors: $('bis-ov-anchors'),
                margin: $('bis-ov-margin'),
                opacity: $('bis-ov-opacity'),
                fontSize: $('bis-ov-fontsize'),
                save: $('bis-ov-save'),
                saved: $('bis-ov-saved')
            };
            let current = null;

            // Defaults applied when /api/overlay/settings can't be reached. They
            // mirror the OverlaySettings record so the dialog stays usable as a
            // local-only editor and the user can SEE that the API is broken
            // instead of silently getting nothing on click.
            const DEFAULT_SETTINGS = Object.freeze({
                enabled: false,
                hideWhenIdle: false,
                screenIndex: -1,
                anchor: 'TopRight',
                margin: 12,
                opacity: 0.80,
                fontSize: 12
            });

            function showError(msg) {
                console.warn('[Overlay panel]', msg);
                els.error.textContent = msg;
                els.error.classList.add('show');
            }

            function clearError() {
                els.error.textContent = '';
                els.error.classList.remove('show');
            }

            function paintAnchor(value) {
                els.anchors.querySelectorAll('button').forEach(b => {
                    b.classList.toggle('active', b.dataset.a === value);
                });
            }

            function applySettings(s) {
                current = s;
                els.enabled.checked = !!s.enabled;
                els.hideIdle.checked = !!s.hideWhenIdle;
                els.screen.value = s.screenIndex != null ? s.screenIndex : -1;
                els.margin.value = s.margin != null ? s.margin : DEFAULT_SETTINGS.margin;
                els.opacity.value = s.opacity != null ? s.opacity : DEFAULT_SETTINGS.opacity;
                els.fontSize.value = s.fontSize != null ? s.fontSize : DEFAULT_SETTINGS.fontSize;
                paintAnchor(s.anchor || DEFAULT_SETTINGS.anchor);
            }

            async function open() {
                // Always open the dialog, even if API calls fail — the user needs
                // to see something happen when they click. Errors are surfaced in
                // the inline banner above the form.
                clearError();
                let screensOk = true, settingsOk = true;

                try { await loadScreens(); }
                catch (e) { screensOk = false; console.warn('[Overlay panel] loadScreens failed:', e); }

                try { await loadSettings(); }
                catch (e) { settingsOk = false; console.warn('[Overlay panel] loadSettings failed:', e); }

                if (!settingsOk) {
                    applySettings({ ...DEFAULT_SETTINGS });
                    showError(
                        'Could not reach /api/overlay/settings — showing defaults. ' +
                        'Check that the overlay controller is registered in the build you are running.'
                    );
                } else if (!screensOk) {
                    showError('Could not list displays (/api/overlay/screens). Only "Primary (auto)" is available.');
                }

                els.backdrop.classList.add('open');
            }

            function close() { els.backdrop.classList.remove('open'); }

            els.trigger && els.trigger.addEventListener('click', open);
            els.close.addEventListener('click', close);
            els.backdrop.addEventListener('click', e => {
                if (e.target === els.backdrop) close();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && els.backdrop.classList.contains('open')) close();
            });

            els.anchors.addEventListener('click', e => {
                const btn = e.target.closest('button[data-a]');
                if (!btn || !current) return;
                current.anchor = btn.dataset.a;
                paintAnchor(current.anchor);
            });

            async function loadScreens() {
                const r = await fetch('/api/overlay/screens');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const list = await r.json();
                els.screen.innerHTML = '';
                const primary = document.createElement('option');
                primary.value = -1;
                primary.textContent = 'Primary (auto)';
                els.screen.appendChild(primary);
                list.forEach(s => {
                    const o = document.createElement('option');
                    o.value = s.index;
                    o.textContent =
                        '#' + (s.index + 1) + ' ' + s.name + ' (' + s.width + '×' + s.height + ')' +
                        (s.isPrimary ? ' — primary' : '');
                    els.screen.appendChild(o);
                });
            }

            async function loadSettings() {
                const r = await fetch('/api/overlay/settings');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                applySettings(await r.json());
            }

            els.save.addEventListener('click', async () => {
                if (!current) return;
                els.saved.classList.remove('error');
                const payload = {
                    enabled: els.enabled.checked,
                    hideWhenIdle: els.hideIdle.checked,
                    screenIndex: parseInt(els.screen.value, 10),
                    anchor: current.anchor || 'TopRight',
                    margin: parseFloat(els.margin.value),
                    opacity: parseFloat(els.opacity.value),
                    fontSize: parseFloat(els.fontSize.value)
                };
                try {
                    const r = await fetch('/api/overlay/settings', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    current = await r.json();
                    clearError();
                    els.saved.textContent = 'Saved';
                    els.saved.classList.add('show');
                    setTimeout(() => els.saved.classList.remove('show'), 1300);
                } catch (e) {
                    console.warn('[Overlay panel] save failed:', e);
                    els.saved.textContent = 'Save failed';
                    els.saved.classList.add('show', 'error');
                    showError('Save failed: ' + e.message + '. The PUT to /api/overlay/settings did not succeed.');
                    setTimeout(() => els.saved.classList.remove('show'), 2500);
                }
            });
        })();
    </script>
</body>
</html>
