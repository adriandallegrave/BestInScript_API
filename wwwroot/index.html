            countdownButton(btn, '📍 Sample at cursor', 3, async () => {
                const pt = selected.pixelTrigger;
                if (!pt) return;
                try {
                    const r = await fetch(`${API}/screen/cursor?radius=${pt.sampleRadius}`);
                    if (!r.ok) { toast('Could not read cursor position', 'error'); return; }
                    const d = await r.json();
                    pt.x = d.x; pt.y = d.y;
                    const xEl = document.getElementById('pt-x');
                    const yEl = document.getElementById('pt-y');
                    if (xEl) xEl.value = d.x;
                    if (yEl) yEl.value = d.y;
                    if (d.readable) {
                        toast(`Pixel set to (${d.x}, ${d.y})`, 'success');
                    } else {
                        toast(`Position (${d.x}, ${d.y}) set, but the screen is unreadable there — fullscreen-exclusive game?`, 'error');
                    }
                } catch (e) {
                    toast('Network error: ' + e.message, 'error');
                }
            });
        }

        function sampleColor(which) {
            const pt = selected.pixelTrigger;
            if (!pt) return;
            const btnId = which === 'ready' ? 'pt-sample-ready' : 'pt-sample-cool';
            const baseLabel = which === 'ready' ? 'Capture ready color' : 'Capture cooldown color';
            const btn = document.getElementById(btnId);
            countdownButton(btn, baseLabel, 3, async () => {
                try {
                    const r = await fetch(`${API}/screen/color?x=${pt.x}&y=${pt.y}&radius=${pt.sampleRadius}`);
                    if (!r.ok) {
                        toast('Screen unreadable at that pixel — is the game fullscreen-exclusive?', 'error');
                        return;
                    }
                    const d = await r.json();
                    const col = [d.r, d.g, d.b];
                    if (which === 'ready') pt.readyColor = col;
                    else pt.cooldownColor = col;
                    updatePixelSwatches();
                    updateColorStatus();
                    toast(`${which === 'ready' ? 'Ready' : 'Cooldown'} color captured — rgb(${d.r}, ${d.g}, ${d.b})`, 'success');
                } catch (e) {
                    toast('Network error: ' + e.message, 'error');
                }
            });
        }

        // ── Live readout ──────────────────────────────────────────────────────────────
        function togglePixelLive() {
            if (pixelLiveTimer) stopPixelLive();
            else startPixelLive();
        }

        function startPixelLive() {
            const btn = document.getElementById('pt-live-btn');
            if (!btn) return;
            btn.textContent = '■ Stop live readout';

            const tick = async () => {
                const pt = selected && selected.pixelTrigger;
                if (!pt) { stopPixelLive(); return; }
                try {
                    const r = await fetch(`${API}/screen/color?x=${pt.x}&y=${pt.y}&radius=${pt.sampleRadius}`);
                    if (!r.ok) { setLiveVerdict('offline', 'UNREADABLE', null); return; }
                    const d = await r.json();
                    const col = [d.r, d.g, d.b];
                    const dReady = colorDistance(col, pt.readyColor);
                    const dCool = colorDistance(col, pt.cooldownColor);
                    let verdict, cls;
                    if (dReady <= pt.tolerance && dReady < dCool) {
                        verdict = pt.requireReset
                            ? 'READY → fires on first match'
                            : 'READY → would fire';
                        cls = 'ready';
                    } else if (dCool < dReady) {
                        verdict = 'WAITING (cooldown)'; cls = 'waiting';
                    } else {
                        verdict = 'NO MATCH'; cls = 'nomatch';
                    }
                    setLiveVerdict(cls, verdict, col);
                } catch {
                    setLiveVerdict('offline', 'API OFFLINE', null);
                }
            };

            tick();
            pixelLiveTimer = setInterval(tick, 400);
        }

        function stopPixelLive() {
            stopCaptureFlow(); // navigating away / closing the panel also cancels any armed capture
            if (pixelLiveTimer) { clearInterval(pixelLiveTimer); pixelLiveTimer = null; }
            const btn = document.getElementById('pt-live-btn');
            if (btn) btn.textContent = '▶ Start live readout';
            const rgb = document.getElementById('pt-live-rgb');
            const sw = document.getElementById('pt-live-swatch');
            const v = document.getElementById('pt-verdict');
            if (rgb) rgb.innerHTML = '<span class="muted">— not running —</span>';
            if (sw) sw.style.background = 'var(--bg0)';
            if (v) { v.className = 'pt-verdict offline'; v.textContent = 'IDLE'; }
        }

        function setLiveVerdict(cls, text, col) {
            const rgb = document.getElementById('pt-live-rgb');
            const sw = document.getElementById('pt-live-swatch');
            const v = document.getElementById('pt-verdict');
            if (v) { v.className = 'pt-verdict ' + cls; v.textContent = text; }
            if (col) {
                if (sw) sw.style.background = `rgb(${col[0]},${col[1]},${col[2]})`;
                if (rgb) rgb.innerHTML = `R ${col[0]} &nbsp; G ${col[1]} &nbsp; B ${col[2]}`;
            } else {
                if (sw) sw.style.background = 'var(--bg0)';
                if (rgb) rgb.innerHTML = '<span class="muted">—</span>';
            }
        }

        // ── Guided in-game capture ──────────────────────────────────────────────────────
        function pickCaptureKey() {
            if (captureListening || captureArmed) return;
            captureListening = true;
            const btn = document.getElementById('pt-cap-key');
            if (!btn) return;
            btn.classList.add('listening');
            btn.textContent = '⌨ Press a key…';

            function onKey(e) {
                e.preventDefault();
                e.stopPropagation();
                const name = mapEventKey(e);
                if (!name || !TRIGGER_KEYS.includes(name)) {
                    toast('Invalid capture hotkey (mouse buttons not allowed)', 'error');
                } else {
                    captureHotkey = name;
                }
                captureListening = false;
                btn.classList.remove('listening');
                btn.textContent = captureHotkey;
                document.removeEventListener('keydown', onKey, true);
            }
            document.addEventListener('keydown', onKey, true);
        }

        async function toggleInGameCapture() {
            if (captureArmed) { stopCaptureFlow(); return; }
            const pt = selected.pixelTrigger;
            if (!pt) return;
            try {
                const r = await fetch(`${API}/screen/capture/arm?hotkey=${encodeURIComponent(captureHotkey)}`, { method: 'POST' });
                if (!r.ok) {
                    let msg = 'Could not arm capture';
                    try { const e = await r.json(); if (e && e.detail) msg = e.detail; } catch { }
                    toast(msg, 'error');
                    return;
                }
                captureArmed = true;
                lastCaptureSeq = -1;
                lastCaptureState = await r.json();
                const startBtn = document.getElementById('pt-cap-start');
                if (startBtn) startBtn.textContent = '■ Cancel capture';
                const keyBtn = document.getElementById('pt-cap-key');
                if (keyBtn) keyBtn.disabled = true;
                renderCaptureStatus();
                captureTimer = setInterval(pollCapture, 400);
                toast(`Capture armed — press ${captureHotkey} in-game over the READY icon`, 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        async function pollCapture() {
            if (!captureArmed) return;
            try {
                const r = await fetch(`${API}/screen/capture/state`);
                if (!r.ok) return;
                const st = await r.json();
                lastCaptureState = st;
                renderCaptureStatus();
                if (st.stage === 'Done' && st.seq !== lastCaptureSeq) {
                    lastCaptureSeq = st.seq;
                    applyCaptureResult(st);
                }
            } catch { /* transient network blip — keep polling */ }
        }

        function applyCaptureResult(st) {
            const pt = selected && selected.pixelTrigger;
            if (!pt) { stopCaptureFlow(); return; }
            if (st.readyColor) pt.readyColor = st.readyColor;
            if (st.coolColor) pt.cooldownColor = st.coolColor;
            pt.x = st.x; pt.y = st.y;
            const xEl = document.getElementById('pt-x'); if (xEl) xEl.value = st.x;
            const yEl = document.getElementById('pt-y'); if (yEl) yEl.value = st.y;
            updatePixelSwatches();
            updateColorStatus();
            toast(`Captured — ready rgb(${(st.readyColor || []).join(', ')}) / cooldown rgb(${(st.coolColor || []).join(', ')})`, 'success');
            // Capture done: disarm on the server and stop polling, but keep the result on screen
            // so the nudge suggestion stays actionable.
            stopCaptureFlow(true);
        }

        function renderCaptureStatus() {
            const el = document.getElementById('pt-cap-status');
            if (!el) return;
            const st = lastCaptureState;
            if (!st || st.stage === 'Idle') {
                el.innerHTML = '';
                renderNudge(null);
                return;
            }
            if (st.unreadable) {
                el.innerHTML = `⚠ Screen unreadable at the cursor — is the game fullscreen-exclusive? ` +
                    `Switch to borderless/windowed and press <strong>${captureHotkey}</strong> again.`;
                el.style.color = 'var(--red)';
            } else if (st.stage === 'AwaitingReady') {
                el.innerHTML = `① In the game, hover the skill icon while it's <strong>READY</strong> and press <strong>${captureHotkey}</strong>.`;
                el.style.color = 'var(--muted)';
            } else if (st.stage === 'AwaitingCooldown') {
                el.innerHTML = `✓ Ready color captured at (${st.x}, ${st.y}). ② Now press <strong>${captureHotkey}</strong> while the icon is <strong>ON COOLDOWN</strong>.`;
                el.style.color = 'var(--muted)';
            } else if (st.stage === 'Done') {
                el.innerHTML = `✓ Capture complete — pixel (${st.x}, ${st.y}) and both colors filled in.`;
                el.style.color = 'var(--accent2)';
            }
            renderNudge(st.suggestion);
        }

        function renderNudge(sg) {
            const nudgeEl = document.getElementById('pt-cap-nudge');
            if (!nudgeEl) return;
            // Only worth suggesting when the chosen pixel is too close AND a nearby one is clearly better.
            if (!sg || (sg.dx === 0 && sg.dy === 0) || sg.separationAtCenter >= 25 || sg.separationAtBest < sg.separationAtCenter + 15) {
                nudgeEl.innerHTML = '';
                return;
            }
            const dx = `${sg.dx >= 0 ? '+' : ''}${sg.dx}`;
            const dy = `${sg.dy >= 0 ? '+' : ''}${sg.dy}`;
            nudgeEl.innerHTML =
                `<div class="pt-hint" style="color:var(--red)">⚠ Ready/cooldown differ by only ${sg.separationAtCenter.toFixed(0)} at your pixel — too close to tell apart reliably.</div>` +
                `<div class="pt-hint" style="margin-top:4px">Nudging to <strong>(${sg.suggestedX}, ${sg.suggestedY})</strong> (${dx}, ${dy}) separates them by <strong>${sg.separationAtBest.toFixed(0)}</strong>.</div>` +
                `<button class="btn-sample" style="margin-top:8px" onclick="applyNudge()">Apply nudge → (${sg.suggestedX}, ${sg.suggestedY})</button>`;
        }

        function applyNudge() {
            const st = lastCaptureState;
            const pt = selected && selected.pixelTrigger;
            if (!st || !st.suggestion || !pt) return;
            const sg = st.suggestion;
            pt.x = sg.suggestedX; pt.y = sg.suggestedY;
            if (sg.suggestedReady) pt.readyColor = sg.suggestedReady;
            if (sg.suggestedCool) pt.cooldownColor = sg.suggestedCool;
            const xEl = document.getElementById('pt-x'); if (xEl) xEl.value = pt.x;
            const yEl = document.getElementById('pt-y'); if (yEl) yEl.value = pt.y;
            updatePixelSwatches();
            updateColorStatus();
            const nudgeEl = document.getElementById('pt-cap-nudge'); if (nudgeEl) nudgeEl.innerHTML = '';
            toast(`Nudged to (${pt.x}, ${pt.y})`, 'success');
        }

        function stopCaptureFlow(keepResult) {
            if (captureTimer) { clearInterval(captureTimer); captureTimer = null; }
            const wasArmed = captureArmed;
            captureArmed = false;
            const startBtn = document.getElementById('pt-cap-start');
            if (startBtn) startBtn.textContent = '▶ Start in-game capture';
            const keyBtn = document.getElementById('pt-cap-key');
            if (keyBtn) keyBtn.disabled = false;
            if (!keepResult) {
                lastCaptureState = null;
                renderCaptureStatus();
            }
            if (wasArmed) {
                fetch(`${API}/screen/capture/disarm`, { method: 'POST' }).catch(() => { });
            }
        }

        // ── Save / Delete ──────────────────────────────────────────────────────────────
        async function saveScript() {
            selected.name = document.getElementById('f-name').value.trim();
            syncDelay();

            if (!selected.name) { toast('Script name is required.', 'error'); return; }

            const payload = {
                id: selected.id || '00000000-0000-0000-0000-000000000000',
                name: selected.name,
                triggerKey: selected.triggerKey,
                steps: selected.steps,
                delayMin: selected.delayMin,
                delayMax: selected.delayMax,
                pixelTrigger: selected.pixelTrigger || null,
                showInOverlay: !!selected.showInOverlay,
                overlayColor: selected.overlayColor || null,
                overlayIcon: selected.overlayIcon || null
            };

            try {
                let r;
                if (isNew) {
                    r = await fetch(`${API}/scripts`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } else {
                    r = await fetch(`${API}/scripts/${selected.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }
                if (!r.ok) {
                    const txt = await r.text();
                    toast('Save failed: ' + txt, 'error');
                    return;
                }
                const saved = await r.json();
                selected = saved;
                isNew = false;
                await loadScripts();
                renderSidebar();
                renderEditor();
                toast(`"${saved.name}" saved ✓`, 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        async function deleteScript() {
            if (!selected || isNew) return;
            if (!confirm(`Delete "${selected.name}"? This cannot be undone.`)) return;
            try {
                const r = await fetch(`${API}/scripts/${selected.id}`, { method: 'DELETE' });
                if (!r.ok) { toast('Delete failed', 'error'); return; }
                await loadScripts();
                showNoScript();
                renderSidebar();
                toast('Script deleted.', 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        async function savePreset() {
            selected.name = document.getElementById('f-name').value.trim();
            if (!selected.name) { toast('Preset name is required.', 'error'); return; }

            const payload = {
                id: selected.id || '00000000-0000-0000-0000-000000000000',
                name: selected.name,
                triggerKey: selected.triggerKey,
                scriptIds: selected.scriptIds || [],
                showInOverlay: !!selected.showInOverlay,
                overlayColor: selected.overlayColor || null,
                overlayIcon: selected.overlayIcon || null
            };

            try {
                const url = isNew ? `${API}/presets` : `${API}/presets/${selected.id}`;
                const method = isNew ? 'POST' : 'PUT';
                const r = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!r.ok) {
                    const txt = await r.text();
                    toast('Save failed: ' + txt, 'error');
                    return;
                }
                const saved = await r.json();
                selected = saved;
                if (!Array.isArray(selected.scriptIds)) selected.scriptIds = [];
                isNew = false;
                await loadPresets();
                renderSidebar();
                renderEditor();
                toast(`"${saved.name}" saved ✓`, 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        async function deletePreset() {
            if (!selected || isNew) return;
            if (!confirm(`Delete preset "${selected.name}"? This cannot be undone.`)) return;
            try {
                const r = await fetch(`${API}/presets/${selected.id}`, { method: 'DELETE' });
                if (!r.ok) { toast('Delete failed', 'error'); return; }
                await loadPresets();
                showNoScript();
                renderSidebar();
                toast('Preset deleted.', 'success');
            } catch (e) {
                toast('Network error: ' + e.message, 'error');
            }
        }

        // ── Stop all ──────────────────────────────────────────────────────────────────
        document.getElementById('btn-stop-all').addEventListener('click', async () => {
            try {
                await fetch(`${API}/engine/stop-all`, { method: 'POST' });
                toast('All scripts stopped.', 'success');
            } catch { toast('Could not reach API.', 'error'); }
        });

        // ── Global emergency-stop hotkey (BACKLOG 1.1) ─────────────────────────────────
        (function () {
            const keyEl = document.getElementById('panic-key');
            const capBtn = document.getElementById('panic-capture');
            const clrBtn = document.getElementById('panic-clear');
            let panicCapturing = false;

            function paint(key) {
                if (key) { keyEl.textContent = key; keyEl.classList.remove('off'); }
                else { keyEl.textContent = 'off'; keyEl.classList.add('off'); }
            }

            async function loadPanic() {
                try {
                    const r = await fetch(`${API}/overlay/settings`);
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    paint((await r.json()).stopAllHotkey);
                } catch { /* leave "off"; overlay controller may be missing in this build */ }
            }

            // PUT replaces the whole OverlaySettings, so GET first and change only the one field.
            async function savePanic(keyOrNull) {
                let settings;
                try {
                    const r = await fetch(`${API}/overlay/settings`);
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    settings = await r.json();
                } catch { toast('Could not read overlay settings.', 'error'); return; }

                settings.stopAllHotkey = keyOrNull;
                try {
                    const r = await fetch(`${API}/overlay/settings`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(settings)
                    });
                    if (!r.ok) { toast(await r.text() || ('Save failed (HTTP ' + r.status + ')'), 'error'); return; }
                    paint((await r.json()).stopAllHotkey);
                    toast(keyOrNull ? `Panic hotkey set to ${keyOrNull}.` : 'Panic hotkey disabled.', 'success');
                } catch { toast('Could not save overlay settings.', 'error'); }
            }

            capBtn.addEventListener('click', () => {
                if (panicCapturing) return;
                panicCapturing = true;
                capBtn.classList.add('listening');
                capBtn.textContent = '⌨ Press…';
                keyEl.textContent = '…';

                function reset() {
                    panicCapturing = false;
                    capBtn.classList.remove('listening');
                    capBtn.textContent = 'Set';
                    document.removeEventListener('keydown', onKey, true);
                }
                function onKey(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (e.code === 'Escape') { loadPanic(); reset(); return; }
                    const name = mapEventKey(e);
                    reset();
                    if (!name || !TRIGGER_KEYS.includes(name)) {
                        toast('Invalid panic key (keyboard keys only).', 'error');
                        loadPanic();
                        return;
                    }
                    savePanic(name);
                }
                document.addEventListener('keydown', onKey, true);
            });

            clrBtn.addEventListener('click', () => savePanic(null));
            loadPanic();
        })();

        // ── New script / preset ───────────────────────────────────────────────────────
        document.getElementById('btn-new').addEventListener('click', newScript);
        document.getElementById('btn-new-preset').addEventListener('click', newPreset);

        // ── Toast ─────────────────────────────────────────────────────────────────────
        function toast(msg, type = 'success') {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            t.className = `toast ${type}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3200);
        }

        // ── Utils ─────────────────────────────────────────────────────────────────────
        function esc(s) {
            return String(s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Close autocomplete on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('.key-input-wrap'))
                document.querySelectorAll('.ac-list').forEach(el => el.style.display = 'none');
        });
    </script>

            .bis-ov-color-def {
                background: var(--bg3);
                color: var(--muted);
                border: 1px solid var(--border);
                border-radius: 4px;
                font-size: 11px;
                padding: 3px 7px;
                cursor: pointer;
            }

                .bis-ov-color-def:hover {
                    color: var(--text);
                }
    </style>

    <div id="bis-ov-backdrop" role="dialog" aria-modal="true" aria-labelledby="bis-ov-title">
        <div id="bis-ov-dialog">
            <header>
                <h2 id="bis-ov-title">Overlay Settings</h2>
                <button id="bis-ov-close" type="button" aria-label="Close">✕</button>
            </header>

            <div id="bis-ov-error"></div>

            <div id="bis-ov-body">
              <div id="bis-ov-general">
                <p class="bis-ov-section-title">Placement</p>
                <label class="bis-ov-check">
                    <input type="checkbox" id="bis-ov-enabled">
                    <span>Show on-screen overlay</span>
                </label>
                <label class="bis-ov-check">
                    <input type="checkbox" id="bis-ov-hideidle">
                    <span>Hide when no script is running</span>
                </label>

                <div class="row">
                    <label for="bis-ov-screen">Display</label>
                    <select id="bis-ov-screen"></select>
                </div>

                <div class="row">
                    <label>Placement</label>
                    <div id="bis-ov-anchors">
                        <button type="button" data-a="TopLeft" title="Top left"></button>
                        <button type="button" data-a="TopCenter" title="Top center"></button>
                        <button type="button" data-a="TopRight" title="Top right"></button>
                        <button type="button" data-a="MiddleLeft" title="Middle left"></button>
                        <button type="button" data-a="MiddleCenter" title="Center"></button>
                        <button type="button" data-a="MiddleRight" title="Middle right"></button>
                        <button type="button" data-a="BottomLeft" title="Bottom left"></button>
                        <button type="button" data-a="BottomCenter" title="Bottom center"></button>
                        <button type="button" data-a="BottomRight" title="Bottom right"></button>
                    </div>
                </div>

                <div class="row">
                    <label>Or drag</label>
                    <div>
                        <button type="button" id="bis-ov-drag">Reposition by dragging</button>
                        <span id="bis-ov-custom-note" style="display:none">Custom (dragged)</span>
                    </div>
                </div>

                <div class="row">
                    <label for="bis-ov-margin">Margin</label>
                    <input type="number" id="bis-ov-margin" min="0" max="400" step="2">
                </div>
                <div class="row">
                    <label for="bis-ov-opacity">Opacity</label>
                    <input type="number" id="bis-ov-opacity" min="0.1" max="1" step="0.05">
                </div>
                <div class="row">
                    <label for="bis-ov-fontsize">Font size</label>
                    <input type="number" id="bis-ov-fontsize" min="8" max="32" step="1">
                </div>
              </div>

                <div id="bis-ov-events">
                    <p class="bis-ov-section-title">Diablo 4 event timers</p>
                    <label class="bis-ov-check">
                        <input type="checkbox" id="bis-ov-events-enabled">
                        <span>Show world boss / helltide / legion timers</span>
                    </label>

                    <div class="bis-ov-evt" data-evt="worldBoss">
                        <div class="bis-ov-evt-head">
                            <span class="bis-ov-evt-name">World Boss</span>
                            <span class="bis-ov-evt-preview" data-preview="worldBoss"></span>
                        </div>
                        <div class="bis-ov-evt-controls">
                            <label class="bis-ov-check"><input type="checkbox" data-k="show"><span>Show</span></label>
                            <label class="bis-ov-check"><input type="checkbox" data-k="alarm"><span>Alarm</span></label>
                            <label class="bis-ov-lead">Warn <input type="number" data-k="warnlead" min="0" max="120" step="1"> min</label>
                            <label class="bis-ov-lead">Blink <input type="number" data-k="lead" min="0" max="120" step="1"> min</label>
                            <label class="bis-ov-lead">Main <input type="color" data-k="color" title="Main color"></label>
                            <button type="button" class="bis-ov-color-def" data-k="colordef">Default</button>
                            <label class="bis-ov-lead">Warning <input type="color" data-k="warncolor" title="Warning / blink color"></label>
                            <button type="button" class="bis-ov-color-def" data-k="warncolordef">Default</button>
                        </div>
                    </div>

                    <div class="bis-ov-evt" data-evt="helltide">
                        <div class="bis-ov-evt-head">
                            <span class="bis-ov-evt-name">Helltide</span>
                            <span class="bis-ov-evt-preview" data-preview="helltide"></span>
                        </div>
                        <div class="bis-ov-evt-controls">
                            <label class="bis-ov-check"><input type="checkbox" data-k="show"><span>Show</span></label>
                            <label class="bis-ov-check"><input type="checkbox" data-k="alarm"><span>Alarm</span></label>
                            <label class="bis-ov-lead">Warn <input type="number" data-k="warnlead" min="0" max="120" step="1"> min</label>
                            <label class="bis-ov-lead">Blink <input type="number" data-k="lead" min="0" max="120" step="1"> min</label>
                            <label class="bis-ov-lead">Main <input type="color" data-k="color" title="Main color"></label>
                            <button type="button" class="bis-ov-color-def" data-k="colordef">Default</button>
                            <label class="bis-ov-lead">Warning <input type="color" data-k="warncolor" title="Warning / blink color"></label>
                            <button type="button" class="bis-ov-color-def" data-k="warncolordef">Default</button>
                        </div>
                    </div>

                    <div class="bis-ov-evt" data-evt="legion">
                        <div class="bis-ov-evt-head">
                            <span class="bis-ov-evt-name">Legion</span>
                            <span class="bis-ov-evt-preview" data-preview="legion"></span>
                        </div>
                        <div class="bis-ov-evt-controls">
                            <label class="bis-ov-check"><input type="checkbox" data-k="show"><span>Show</span></label>
                            <label class="bis-ov-check"><input type="checkbox" data-k="alarm"><span>Alarm</span></label>
                            <label class="bis-ov-lead">Warn <input type="number" data-k="warnlead" min="0" max="120" step="1"> min</label>
                            <label class="bis-ov-lead">Blink <input type="number" data-k="lead" min="0" max="120" step="1"> min</label>
                            <label class="bis-ov-lead">Main <input type="color" data-k="color" title="Main color"></label>
                            <button type="button" class="bis-ov-color-def" data-k="colordef">Default</button>
                            <label class="bis-ov-lead">Warning <input type="color" data-k="warncolor" title="Warning / blink color"></label>
                            <button type="button" class="bis-ov-color-def" data-k="warncolordef">Default</button>
                        </div>
                    </div>
                </div>
            </div>

            <footer>
                <button id="bis-ov-save" type="button">Save</button>
                <span id="bis-ov-saved">Saved</span>
            </footer>
        </div>
    </div>

    <script>
        (function () {
            const $ = id => document.getElementById(id);

            const EVENTS = ['worldBoss', 'helltide', 'legion'];

            // Color <-> [R,G,B], sharing the "white == no override (null)" convention
            // used by the per-script accent colors elsewhere in the UI.
            function hexToRgb(hex) {
                const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || '');
                return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : null;
            }
            function rgbToHex(rgb) {
                if (!Array.isArray(rgb) || rgb.length !== 3) return null;
                return '#' + rgb.map(v => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, '0')).join('');
            }
            const evtEl = (evt, k) => document.querySelector('.bis-ov-evt[data-evt="' + evt + '"] [data-k="' + k + '"]');
            const previewEl = evt => document.querySelector('.bis-ov-evt-preview[data-preview="' + evt + '"]');

            // 1. Inject the trigger button into the existing header, just before "Stop All".
            const stopBtn = $('btn-stop-all');
            if (stopBtn && !$('bis-ov-trigger')) {
                const btn = document.createElement('button');
                btn.id = 'bis-ov-trigger';
                btn.type = 'button';
                btn.textContent = '⚙ Overlay';
                stopBtn.parentNode.insertBefore(btn, stopBtn);
            }

            const els = {
                trigger: $('bis-ov-trigger'),
                backdrop: $('bis-ov-backdrop'),
                dialog: $('bis-ov-dialog'),
                close: $('bis-ov-close'),
                error: $('bis-ov-error'),
                enabled: $('bis-ov-enabled'),
                hideIdle: $('bis-ov-hideidle'),
                screen: $('bis-ov-screen'),
                anchors: $('bis-ov-anchors'),
                margin: $('bis-ov-margin'),
                opacity: $('bis-ov-opacity'),
                fontSize: $('bis-ov-fontsize'),
                eventsEnabled: $('bis-ov-events-enabled'),
                drag: $('bis-ov-drag'),
                customNote: $('bis-ov-custom-note'),
                save: $('bis-ov-save'),
                saved: $('bis-ov-saved')
            };
            let current = null;

            // Reset an event's colors to their defaults: main → white (== no override),
            // warning → amber (#ffaa33, the renderer's null fallback).
            EVENTS.forEach(evt => {
                const def = evtEl(evt, 'colordef');
                if (def) def.addEventListener('click', () => { evtEl(evt, 'color').value = '#ffffff'; });
                const wdef = evtEl(evt, 'warncolordef');
                if (wdef) wdef.addEventListener('click', () => { evtEl(evt, 'warncolor').value = '#ffaa33'; });
            });

            // Defaults applied when /api/overlay/settings can't be reached. They
            // mirror the OverlaySettings record so the dialog stays usable as a
            // local-only editor and the user can SEE that the API is broken
            // instead of silently getting nothing on click.
            const EVT_DEFAULT = { show: true, alarmEnabled: false, warningLeadMinutes: 30, alarmLeadMinutes: 5, color: null, warningColor: null };
            const DEFAULT_SETTINGS = Object.freeze({
                enabled: false,
                hideWhenIdle: false,
                screenIndex: -1,
                anchor: 'TopRight',
                margin: 12,
                opacity: 0.80,
                fontSize: 12,
                eventsEnabled: true,
                worldBoss: { ...EVT_DEFAULT, alarmEnabled: true },
                helltide: { ...EVT_DEFAULT },
                legion: { ...EVT_DEFAULT }
            });

            function showError(msg) {
                console.warn('[Overlay panel]', msg);
                els.error.textContent = msg;
                els.error.classList.add('show');
            }

            function clearError() {
                els.error.textContent = '';
                els.error.classList.remove('show');
            }

            function paintAnchor(value) {
                els.anchors.querySelectorAll('button').forEach(b => {
                    b.classList.toggle('active', b.dataset.a === value);
                });
                // 'Custom' matches no grid button; show the note so the user knows the
                // position came from a drag (and picking a grid anchor will replace it).
                els.customNote.style.display = value === 'Custom' ? '' : 'none';
            }

            function applySettings(s) {
                current = s;
                els.enabled.checked = !!s.enabled;
                els.hideIdle.checked = !!s.hideWhenIdle;
                els.screen.value = s.screenIndex != null ? s.screenIndex : -1;
                els.margin.value = s.margin != null ? s.margin : DEFAULT_SETTINGS.margin;
                els.opacity.value = s.opacity != null ? s.opacity : DEFAULT_SETTINGS.opacity;
                els.fontSize.value = s.fontSize != null ? s.fontSize : DEFAULT_SETTINGS.fontSize;
                paintAnchor(s.anchor || DEFAULT_SETTINGS.anchor);

                els.eventsEnabled.checked = s.eventsEnabled !== false;
                EVENTS.forEach(evt => {
                    const cfg = s[evt] || EVT_DEFAULT;
                    evtEl(evt, 'show').checked = cfg.show !== false;
                    evtEl(evt, 'alarm').checked = !!cfg.alarmEnabled;
                    evtEl(evt, 'warnlead').value = cfg.warningLeadMinutes != null ? cfg.warningLeadMinutes : 30;
                    evtEl(evt, 'lead').value = cfg.alarmLeadMinutes != null ? cfg.alarmLeadMinutes : 5;
                    evtEl(evt, 'color').value = rgbToHex(cfg.color) || '#ffffff';
                    evtEl(evt, 'warncolor').value = rgbToHex(cfg.warningColor) || '#ffaa33';
                });
            }

            async function open() {
                // Always open the dialog, even if API calls fail — the user needs
                // to see something happen when they click. Errors are surfaced in
                // the inline banner above the form.
                clearError();
                let screensOk = true, settingsOk = true;

                try { await loadScreens(); }
                catch (e) { screensOk = false; console.warn('[Overlay panel] loadScreens failed:', e); }

                try { await loadSettings(); }
                catch (e) { settingsOk = false; console.warn('[Overlay panel] loadSettings failed:', e); }

                if (!settingsOk) {
                    applySettings({ ...DEFAULT_SETTINGS });
                    showError(
                        'Could not reach /api/overlay/settings — showing defaults. ' +
                        'Check that the overlay controller is registered in the build you are running.'
                    );
                } else if (!screensOk) {
                    showError('Could not list displays (/api/overlay/screens). Only "Primary (auto)" is available.');
                }

                els.backdrop.classList.add('open');
                loadEventsPreview();
            }

            function close() { els.backdrop.classList.remove('open'); }

            els.trigger && els.trigger.addEventListener('click', open);
            els.close.addEventListener('click', close);
            els.backdrop.addEventListener('click', e => {
                if (e.target === els.backdrop) close();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && els.backdrop.classList.contains('open')) close();
            });

            els.anchors.addEventListener('click', e => {
                const btn = e.target.closest('button[data-a]');
                if (!btn || !current) return;
                current.anchor = btn.dataset.a;
                paintAnchor(current.anchor);
            });

            // Arm drag-to-position edit mode on the live overlay pill. The user then
            // drags the pill in-game and clicks ✓/✕ on it — no coordinate guessing.
            els.drag && els.drag.addEventListener('click', async () => {
                try {
                    const r = await fetch('/api/overlay/edit-mode', { method: 'POST' });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    clearError();
                    els.saved.textContent = 'Drag the pill, then click ✓ to keep or ✕ to cancel';
                    els.saved.classList.remove('error');
                    els.saved.classList.add('show');
                    setTimeout(() => els.saved.classList.remove('show'), 4000);
                } catch (e) {
                    showError('Could not start drag mode (POST /api/overlay/edit-mode failed): ' + e.message +
                        '. The overlay only runs on Windows.');
                }
            });

            async function loadScreens() {
                const r = await fetch('/api/overlay/screens');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const list = await r.json();
                els.screen.innerHTML = '';
                const primary = document.createElement('option');
                primary.value = -1;
                primary.textContent = 'Primary (auto)';
                els.screen.appendChild(primary);
                list.forEach(s => {
                    const o = document.createElement('option');
                    o.value = s.index;
                    o.textContent =
                        '#' + (s.index + 1) + ' ' + s.name + ' (' + s.width + '×' + s.height + ')' +
                        (s.isPrimary ? ' — primary' : '');
                    els.screen.appendChild(o);
                });
            }

            async function loadSettings() {
                const r = await fetch('/api/overlay/settings');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                applySettings(await r.json());
            }

            function setPreview(evt, text) { const el = previewEl(evt); if (el) el.textContent = text; }

            // Read-only reference: show the current live countdowns next to each event.
            async function loadEventsPreview() {
                EVENTS.forEach(evt => setPreview(evt, '…'));
                try {
                    const r = await fetch('/api/overlay/events');
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    const d = await r.json();
                    if (!d || !d.hasData) { EVENTS.forEach(evt => setPreview(evt, '—')); return; }
                    setPreview('worldBoss', d.worldBoss
                        ? [d.worldBoss.name, d.worldBoss.zone, d.worldBoss.remaining].filter(Boolean).join(' · ') : '—');
                    setPreview('helltide', d.helltide
                        ? (d.helltide.active ? 'active · ' : 'starts · ') + d.helltide.remaining : '—');
                    setPreview('legion', d.legion ? d.legion.remaining : '—');
                } catch (e) {
                    console.warn('[Overlay panel] events preview failed:', e);
                    EVENTS.forEach(evt => setPreview(evt, ''));
                }
            }

            // Build one event's config for the save payload. Main color: white == null
            // override (white label). Warning color: amber (#ffaa33) == null == default.
            function evtPayload(evt) {
                const hex = evtEl(evt, 'color').value;
                const whex = evtEl(evt, 'warncolor').value;
                return {
                    show: evtEl(evt, 'show').checked,
                    alarmEnabled: evtEl(evt, 'alarm').checked,
                    warningLeadMinutes: parseInt(evtEl(evt, 'warnlead').value, 10) || 0,
                    alarmLeadMinutes: parseInt(evtEl(evt, 'lead').value, 10) || 0,
                    color: hex && hex.toLowerCase() !== '#ffffff' ? hexToRgb(hex) : null,
                    warningColor: whex && whex.toLowerCase() !== '#ffaa33' ? hexToRgb(whex) : null
                };
            }

            els.save.addEventListener('click', async () => {
                if (!current) return;
                els.saved.classList.remove('error');
                const payload = {
                    enabled: els.enabled.checked,
                    hideWhenIdle: els.hideIdle.checked,
                    screenIndex: parseInt(els.screen.value, 10),
                    anchor: current.anchor || 'TopRight',
                    margin: parseFloat(els.margin.value),
                    // Echo the dragged position so a Save (e.g. opacity tweak) can't wipe it.
                    positionX: current.positionX || 0,
                    positionY: current.positionY || 0,
                    opacity: parseFloat(els.opacity.value),
                    fontSize: parseFloat(els.fontSize.value),
                    eventsEnabled: els.eventsEnabled.checked,
                    worldBoss: evtPayload('worldBoss'),
                    helltide: evtPayload('helltide'),
                    legion: evtPayload('legion')
                };
                try {
                    const r = await fetch('/api/overlay/settings', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    current = await r.json();
                    clearError();
                    els.saved.textContent = 'Saved';
                    els.saved.classList.add('show');
                    setTimeout(() => els.saved.classList.remove('show'), 1300);
                } catch (e) {
                    console.warn('[Overlay panel] save failed:', e);
                    els.saved.textContent = 'Save failed';
                    els.saved.classList.add('show', 'error');
                    showError('Save failed: ' + e.message + '. The PUT to /api/overlay/settings did not succeed.');
                    setTimeout(() => els.saved.classList.remove('show'), 2500);
                }
            });
        })();
    </script>
</body>
</html>
